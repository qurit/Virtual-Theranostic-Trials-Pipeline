<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Theranostic Trials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .terminal-font { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace; }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1;}50%{opacity:0;} }
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── constants ────────────────────────────────────────────────────────────────
const DEVELOPER_FIELDS = new Set([
  'output_folder_title','sub_dir_name','file_prefix',
  'unification_prefix','label_map_path','SIMINDDirectory',
]);
const PHASE_LABELS = {
  phase_1:'Phase 1 — Digital Twin & Ground Truth',
  phase_2:'Phase 2 — Simulations',
  phase_3:'Phase 3 — Post-Processing',
};
const STAGE_LABELS = {
  segmentation_stage:'Segmentation & ROI Unification',
  synthetic_lesions_stage:'Synthetic Lesion Generation',
  pbpk_tac_stage:'PBPK Pharmacokinetics',
  simind_stage:'SIMIND SPECT Simulation',
  opengate_stage:'OpenGATE Dosimetry',
  spect_postprocess_stage:'SPECT Post-Processing',
  dosemap_postprocess_stage:'Dose Map Post-Processing',
  gate:'Monte Carlo Engine',source:'Source Definition',physics:'Physics Settings',
};
const CLI_FLAGS = [
  {key:'spect',          label:'SPECT Simulation',  desc:'Run SIMIND Monte Carlo SPECT projection simulation (Phase 2)'},
  {key:'dosimetry',      label:'Dosimetry',          desc:'Run OpenGATE Monte Carlo absorbed-dose simulation (Phase 2)'},
  {key:'postprocess',    label:'Post-Processing',    desc:'Apply TAC weighting, Poisson noise, OSEM reconstruction (Phase 3)'},
  {key:'synthetic_lesions',label:'Synthetic Lesions',desc:'Insert synthetic tumour lesions before simulation (Phase 1)'},
  {key:'logging_on',     label:'Logging',            desc:"Write a detailed pipeline log file to each patient's output directory"},
];
const PROB_OPTIONS = ['uniform','gaussian','user_defined'];

// ─── helpers ──────────────────────────────────────────────────────────────────
async function apiFetch(path,opts={}){
  return fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});
}
function deepSet(obj,path,value){
  const out=JSON.parse(JSON.stringify(obj));let cur=out;
  for(let i=0;i<path.length-1;i++) cur=cur[path[i]];
  cur[path[path.length-1]]=value;return out;
}
// Strip ANSI escape codes so terminal output is clean
function stripAnsi(str){
  return str.replace(/(\x1b|\u001b)\[[0-9;]*[A-Za-z]/g,'').replace(/\[\d+m/g,'');
}

// ─── StepBar ──────────────────────────────────────────────────────────────────
function StepBar({step}){
  const steps=['Welcome','CT Input','Configure','Run'];
  return(
    <div className="sticky top-0 z-20 bg-white border-b border-slate-200 shadow-sm">
      <div className="max-w-4xl mx-auto px-6 py-3 flex items-center justify-center gap-1">
        {steps.map((label,i)=>{
          const n=i+1,done=n<step,active=n===step;
          return(
            <React.Fragment key={n}>
              <div className="flex flex-col items-center min-w-[60px]">
                <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold select-none
                  ${done?'bg-emerald-500 text-white':active?'bg-blue-600 text-white':'bg-slate-200 text-slate-400'}`}>
                  {done?'✓':n}
                </div>
                <span className={`text-[11px] mt-0.5 font-medium ${active?'text-blue-600':'text-slate-400'}`}>{label}</span>
              </div>
              {i<steps.length-1&&<div className={`h-px w-10 mb-4 flex-shrink-0 ${done?'bg-emerald-400':'bg-slate-200'}`}/>}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

// ─── Page 1 ───────────────────────────────────────────────────────────────────
function Page1Welcome({onNext}){
  return(
    <div className="max-w-3xl mx-auto px-6 py-12">
      <div className="mb-8">
        <h1 className="text-4xl font-bold text-slate-900 mb-1">Virtual Theranostic Trials</h1>
        <p className="text-blue-600 font-semibold text-lg">BC Cancer Research Centre</p>
      </div>
      <div className="bg-blue-50 border border-blue-100 rounded-2xl p-6 mb-6">
        <h2 className="font-semibold text-blue-900 mb-3 text-lg">Pipeline Overview</h2>
        <p className="text-slate-600 text-sm mb-5">VTT builds a patient-specific digital twin from a CT scan and simulates personalised theranostic treatment end-to-end:</p>
        {[
          {n:'1',color:'bg-blue-100 text-blue-700',title:'Digital Twin & Ground Truth',lines:['TotalSegmentator organ segmentation','Optional synthetic lesion insertion','PBPK time-activity curve generation']},
          {n:'2',color:'bg-violet-100 text-violet-700',title:'Monte Carlo Simulations',lines:['SIMIND SPECT projection simulation','OpenGATE absorbed-dose Monte Carlo']},
          {n:'3',color:'bg-emerald-100 text-emerald-700',title:'Post-Processing',lines:['TAC-weighted OSEM+TEW SPECT reconstruction','Cumulated-activity dosimetry maps']},
        ].map(({n,color,title,lines})=>(
          <div key={n} className="flex gap-4 mb-4 last:mb-0">
            <div className={`${color} w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold mt-0.5`}>{n}</div>
            <div><p className="font-semibold text-slate-800 text-sm">{title}</p>
              <ul className="mt-1 space-y-0.5">{lines.map(l=><li key={l} className="text-xs text-slate-500">· {l}</li>)}</ul>

        ))}
      </div>
      <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-8">
        <p className="font-semibold text-amber-800 mb-2 text-sm">Before you start</p>
        <ul className="space-y-1 text-amber-700 text-xs">
          <li>· Conda environment active: <code className="bg-amber-100 px-1 rounded font-mono">conda activate vtt</code></li>
          <li>· SIMIND path set in <code className="bg-amber-100 px-1 rounded font-mono">src/data/pipeline_paths.json</code></li>
          <li>· CT data as DICOM subfolders or <code className="bg-amber-100 px-1 rounded font-mono">.nii / .nii.gz</code> files</li>

      </div>
      <button onClick={onNext} className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold text-base transition-colors shadow-sm">Get Started →</button>

// ─── Page 2 ───────────────────────────────────────────────────────────────────
function Page2CTInput({patients,setPatients,patientShapes,setPatientShapes,onNext,onBack}){
  const [folderPath,setFolderPath]=useState('');
  const [picking,setPicking]=useState(false);
  const [scanning,setScanning]=useState(false);
  const [error,setError]=useState('');
  const [previews,setPreviews]=useState({});

  const pickAndScan=async()=>{
    setPicking(true);setError('');
    try{
      const res=await apiFetch('/api/pick-directory',{method:'POST',body:'{}'});
      const data=await res.json();
      if(data.cancelled||!data.path){setPicking(false);return;}
      setFolderPath(data.path);setPicking(false);setScanning(true);
      setPatients([]);setPreviews({});setPatientShapes({});
      const sres=await apiFetch('/api/scan-directory',{method:'POST',body:JSON.stringify({path:data.path})});
      if(!sres.ok){const err=await sres.json();setError(err.detail||'Scan failed');setScanning(false);return;}
      const sdata=await sres.json();
      setPatients(sdata.patients);
      sdata.patients.forEach(p=>loadPreview(p));
    }catch(e){setError('Error: '+e.message);}
    setPicking(false);setScanning(false);
  };
  const loadPreview=async(patient)=>{
    setPreviews(prev=>({...prev,[patient.name]:{loading:true}}));
    try{
      const res=await apiFetch('/api/preview-ct',{method:'POST',body:JSON.stringify({path:patient.path,ct_type:patient.type})});
      if(!res.ok){setPreviews(prev=>({...prev,[patient.name]:{error:'Preview failed'}}));return;}
      const data=await res.json();
      setPreviews(prev=>({...prev,[patient.name]:{...data,loading:false}}));
      if(data.shape) setPatientShapes(prev=>({...prev,[patient.name]:data.shape}));
    }catch(e){setPreviews(prev=>({...prev,[patient.name]:{error:e.message}}));}
  };
  const busy=picking||scanning;
  return(
    <div className="max-w-4xl mx-auto px-6 py-8">
      <div className="flex items-center gap-3 mb-6">
        <button onClick={onBack} className="text-slate-400 hover:text-slate-600 text-sm flex items-center gap-1">← Back</button>
        <h2 className="text-2xl font-bold text-slate-900">Select CT Input Folder</h2>
      </div>
      <p className="text-slate-500 text-sm mb-6">Each top-level item is one patient — a DICOM subfolder or a <code className="bg-slate-100 px-1 rounded">.nii/.nii.gz</code> file.</p>
      <div className="flex items-center gap-4 mb-6">
        <button onClick={pickAndScan} disabled={busy}
          className="flex items-center gap-2 bg-white border-2 border-blue-500 hover:bg-blue-50 text-blue-600 px-6 py-3 rounded-xl font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
          {picking?<><span className="spin">⟳</span>&nbsp;Opening picker…</>:scanning?<><span className="spin">⟳</span>&nbsp;Scanning…</>:<>📁&nbsp;Choose CT Folder</>}
        </button>
        {folderPath&&!busy&&(
          <div className="flex items-center gap-2 text-sm text-slate-500 min-w-0">
            <span className="text-emerald-500 flex-shrink-0">✓</span>
            <span className="terminal-font bg-slate-100 px-2 py-1 rounded text-xs truncate max-w-sm">{folderPath}</span>
          </div>
        )}
      </div>
      {error&&<div className="bg-red-50 border border-red-200 rounded-xl p-3 mb-4 text-red-700 text-sm">{error}</div>}
      {patients.length>0&&(
        <>
          <h3 className="text-base font-semibold text-slate-700 mb-3">Detected {patients.length} patient{patients.length!==1?'s':''}</h3>
          <div className="space-y-4 mb-8">
            {patients.map((p,i)=>{
              const preview=previews[p.name]||{};
              return(
                <div key={p.name} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                  <div className="flex items-center gap-3 mb-3">
                    <span className="bg-blue-100 text-blue-700 font-bold text-xs px-3 py-1 rounded-full">CT_{i+1}</span>
                    <span className="font-semibold text-slate-800">{p.name}</span>
                    <span className="text-xs text-slate-400 uppercase tracking-wide">{p.type}</span>
                    {p.file_count!=null&&<span className="text-xs text-slate-400">{p.file_count} files</span>}
                  </div>
                  {preview.loading&&<div className="flex items-center gap-2 text-sm text-slate-400 py-4"><span className="spin">⟳</span> Generating previews…</div>}
                  {preview.error&&<p className="text-sm text-red-500 py-2">{preview.error}</p>}
                  {!preview.loading&&!preview.error&&preview.axial&&(
                    <div className="flex gap-3 items-start">
                      {['axial','coronal','sagittal'].map(view=>(
                        <div key={view} className="flex-1 min-w-0">
                          <p className="text-[11px] text-slate-400 text-center mb-1 capitalize font-medium">{view}</p>
                          <div className="h-44 bg-black rounded-lg border border-slate-200 flex items-center justify-center overflow-hidden">
                            <img src={`data:image/png;base64,${preview[view]}`} alt={view}
                              style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',display:'block'}}/>
                          </div>
                        </div>
                      ))}
                      {preview.shape&&(
                        <div className="flex-shrink-0 w-20 flex flex-col justify-center text-xs text-slate-400 pt-5 space-y-0.5">
                          <p className="font-semibold text-slate-600 text-[11px]">CT Shape</p>
                          <p>X: {preview.shape[0]}</p><p>Y: {preview.shape[1]}</p><p>Z: {preview.shape[2]}</p>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <button onClick={onNext} className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold text-base transition-colors shadow-sm">Continue to Configure →</button>
        </>
      )}
    </div>
  );
}

// ─── XyzDimFieldInner ─────────────────────────────────────────────────────────
function XyzDimFieldInner({value,onChange,desc,patientShape}){
  const initNull=value===null||value===undefined;
  const initXyz=(Array.isArray(value)&&value.length>=3)?[String(value[0]),String(value[1]),String(value[2])]:['','',''];
  const [isNull,setIsNull]=useState(initNull);
  const [xyz,setXyz]=useState(initXyz);
  const [errors,setErrors]=useState(['','','']);
  const [showDesc,setShowDesc]=useState(false);
  const ax=['X','Y','Z'];
  const validate=(idx,val)=>{
    if(val==='')return'Required';
    const n=parseInt(val,10);
    if(isNaN(n)||n<=0)return'Positive integer required';
    if(patientShape&&n>=patientShape[idx])return`Must be < ${patientShape[idx]}`;
    return'';
  };
  const change=(idx,val)=>{const nx=xyz.map((v,i)=>i===idx?val:v);setXyz(nx);setErrors(errors.map((e,i)=>i===idx?validate(idx,val):e));};
  const blur=(idx)=>{const e=validate(idx,xyz[idx]);const ne=errors.map((x,i)=>i===idx?e:x);setErrors(ne);if(ne.every(e=>!e)&&xyz.every(v=>v!==''))onChange(xyz.map(v=>parseInt(v,10)));};
  const toggleNull=(c)=>{setIsNull(c);if(c){onChange(null);setErrors(['','','']);}else setXyz(['','','']);};
  return(
    <div className="py-2 border-b border-slate-100 last:border-0">
      <div className="flex items-start justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-1.5 flex-shrink-0 pt-0.5">
          <span className="text-sm font-medium text-slate-700">xyz_dim</span>
          {desc&&<button onClick={()=>setShowDesc(s=>!s)} className="text-slate-300 hover:text-blue-400 text-[10px] w-3.5 h-3.5 rounded-full border border-current flex items-center justify-center leading-none">?</button>}
        </div>
        <div className="flex items-start gap-3 flex-wrap justify-end">
          <label className="flex items-center gap-1.5 text-xs text-slate-500 cursor-pointer select-none pt-1">
            <input type="checkbox" checked={isNull} onChange={e=>toggleNull(e.target.checked)} className="accent-blue-600"/>
            null&nbsp;<span className="text-slate-400">(native CT resolution)</span>
          </label>
          {!isNull&&(
            <div className="flex items-start gap-1.5">
              {ax.map((a,idx)=>(
                <div key={a} className="flex flex-col items-center gap-0.5">
                  <div className="flex items-center gap-0.5">
                    <span className="text-[10px] font-semibold text-slate-500 w-3.5">{a}</span>
                    <input type="number" value={xyz[idx]} min="1" max={patientShape?patientShape[idx]-1:undefined}
                      placeholder={patientShape?`<${patientShape[idx]}`:'…'}
                      onChange={e=>change(idx,e.target.value)} onBlur={()=>blur(idx)}
                      className={`w-[72px] px-1.5 py-1 text-sm border rounded-lg text-right focus:outline-none focus:ring-2
                        ${errors[idx]?'border-red-400 focus:ring-red-300 bg-red-50':'border-slate-300 focus:ring-blue-400'}`}/>
                  </div>
                  {errors[idx]&&<span className="text-[9px] text-red-500 text-center leading-tight max-w-[76px]">{errors[idx]}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
      {showDesc&&<p className="text-xs text-slate-400 mt-1.5 leading-relaxed">{desc}</p>}
    </div>
  );
}

// ─── NullField ────────────────────────────────────────────────────────────────
function NullField({call}){
  const [isNull,setIsNull]=useState(true);
  const [txt,setTxt]=useState('');
  return(
    <div className="flex items-center gap-2">
      <label className="flex items-center gap-1 text-xs text-slate-500 cursor-pointer select-none">
        <input type="checkbox" checked={isNull} onChange={e=>{setIsNull(e.target.checked);if(e.target.checked)call(null);}} className="accent-blue-600"/>
        null
      </label>
      {!isNull&&(
        <input type="text" value={txt} placeholder="value"
          onChange={e=>setTxt(e.target.value)}
          onBlur={e=>{const r=e.target.value;const n=parseFloat(r);call(isNaN(n)?(r||null):n);}}
          className="w-32 px-2 py-1 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      )}
    </div>
  );
}

// ─── RandomSeedField ─────────────────────────────────────────────────────────
function RandomSeedField({value,onChange,desc}){
  const [showDesc,setShowDesc]=useState(false);
  const isAuto=value==='auto';
  const [fixedVal,setFixedVal]=useState(isAuto?'42':String(value));
  return(
    <div className="py-2 border-b border-slate-100 last:border-0">
      <div className="flex items-center justify-between gap-3">
        <div className="flex items-center gap-1.5 flex-shrink-0">
          <span className="text-sm font-medium text-slate-700">random_seed</span>
          {desc&&<button onClick={()=>setShowDesc(s=>!s)} className="text-slate-300 hover:text-blue-400 text-[10px] w-3.5 h-3.5 rounded-full border border-current flex items-center justify-center leading-none">?</button>}
        </div>
        <div className="flex items-center gap-1.5">
          <button onClick={()=>onChange('auto')}
            className={`px-3 py-1 text-xs rounded-lg border font-semibold transition-colors
              ${isAuto?'bg-blue-600 text-white border-blue-600':'bg-white text-slate-500 border-slate-300 hover:border-blue-400'}`}>
            auto
          </button>
          <button onClick={()=>{const n=parseInt(fixedVal);onChange(isNaN(n)?42:n);}}
            className={`px-3 py-1 text-xs rounded-lg border font-semibold transition-colors
              ${!isAuto?'bg-slate-700 text-white border-slate-700':'bg-white text-slate-500 border-slate-300 hover:border-slate-400'}`}>
            fixed
          </button>
          {!isAuto&&(
            <input type="number" value={fixedVal}
              onChange={e=>setFixedVal(e.target.value)}
              onBlur={()=>{const n=parseInt(fixedVal);if(!isNaN(n))onChange(n);}}
              className="w-24 px-2 py-1 text-sm border border-slate-300 rounded-lg text-right focus:outline-none focus:ring-2 focus:ring-blue-400"/>
          )}
        </div>
      </div>
      {showDesc&&<p className="text-xs text-slate-400 mt-1 leading-relaxed">{desc}</p>}
    </div>
  );
}

// ─── SpecsEditor ─────────────────────────────────────────────────────────────
// Per-ROI lesion spec UI for synthetic_lesions_stage.specs
function UserDefinedInputs({nLesions,centers,radii,onUpdateCenters,onUpdateRadii}){
  // centers = [[z,y,x], ...], radii = [r, ...]
  const rows=Array.from({length:nLesions},(_,i)=>({
    z:centers[i]?String(centers[i][0]):'0',
    y:centers[i]?String(centers[i][1]):'0',
    x:centers[i]?String(centers[i][2]):'0',
    r:radii[i]!=null?String(radii[i]):'5',
  }));
  const commit=(newRows)=>{
    onUpdateCenters(newRows.map(r=>[parseFloat(r.z)||0,parseFloat(r.y)||0,parseFloat(r.x)||0]));
    onUpdateRadii(newRows.map(r=>parseFloat(r.r)||5));
  };
  const [local,setLocal]=useState(rows);
  const set=(i,f,v)=>{const nr=local.map((r,ri)=>ri===i?{...r,[f]:v}:r);setLocal(nr);commit(nr);};
  return(
    <div className="mt-1 overflow-x-auto">
      <table className="w-full text-xs">
        <thead>
          <tr className="text-slate-400 text-[10px]">
            <th className="text-left pb-1 pr-1 font-medium w-6">#</th>
            <th className="text-left pb-1 pr-1 font-medium">Z</th>
            <th className="text-left pb-1 pr-1 font-medium">Y</th>
            <th className="text-left pb-1 pr-1 font-medium">X</th>
            <th className="text-left pb-1 font-medium">Radius (mm)</th>
          </tr>
        </thead>
        <tbody>
          {local.map((row,i)=>(
            <tr key={i} className="border-t border-slate-50">
              <td className="py-0.5 pr-1 text-slate-400">{i+1}</td>
              {['z','y','x'].map(f=>(
                <td key={f} className="py-0.5 pr-1">
                  <input type="number" value={row[f]} onChange={e=>set(i,f,e.target.value)}
                    className="w-16 px-1.5 py-0.5 border border-slate-200 rounded text-right focus:outline-none focus:ring-1 focus:ring-blue-400"/>
                </td>
              ))}
              <td className="py-0.5">
                <input type="number" value={row.r} onChange={e=>set(i,'r',e.target.value)} min="0"
                  className="w-16 px-1.5 py-0.5 border border-slate-200 rounded text-right focus:outline-none focus:ring-1 focus:ring-blue-400"/>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function SpecRoiCard({roi,spec,onUpdateSpec,onRemove}){
  const [open,setOpen]=useState(true);
  const [numErrs,setNumErrs]=useState({});
  const setField=(field,val)=>{
    let newSpec={...spec,[field]:val};
    // When prob changes, initialize/clean optional fields
    if(field==='prob'){
      if(val==='user_defined'){
        const n=spec.n_lesions||1;
        newSpec.user_centers_zyx=Array.from({length:n},()=>[0,0,0]);
        newSpec.radii_mm=Array.from({length:n},()=>5.0);
        delete newSpec.sigma_mm;
      } else if(val==='gaussian'){
        delete newSpec.user_centers_zyx;delete newSpec.radii_mm;
        if(!newSpec.sigma_mm) newSpec.sigma_mm=10.0;
      } else {
        delete newSpec.user_centers_zyx;delete newSpec.radii_mm;delete newSpec.sigma_mm;
      }
    }
    // When n_lesions changes for user_defined, resize coord arrays
    if(field==='n_lesions'&&spec.prob==='user_defined'){
      const c=[...(spec.user_centers_zyx||[])];
      const r=[...(spec.radii_mm||[])];
      while(c.length<val)c.push([0,0,0]);c.length=val;
      while(r.length<val)r.push(5.0);r.length=val;
      newSpec.user_centers_zyx=c;newSpec.radii_mm=r;
    }
    onUpdateSpec(newSpec);
  };
  const numField=(label,field,step,isInt)=>{
    const val=spec[field]??0;const err=numErrs[field]||'';
    return(
      <div key={field} className="flex items-center justify-between py-1.5 border-b border-slate-50 last:border-0 gap-2">
        <span className="text-xs font-medium text-slate-600 flex-shrink-0">{label}</span>
        <div className="flex flex-col items-end gap-0.5">
          <input type="number" defaultValue={val} step={step||1}
            onChange={e=>{const v=e.target.value;setNumErrs(prev=>({...prev,[field]:v===''||isNaN(parseFloat(v))?'Must be a number':''}));}}
            onBlur={e=>{const v=e.target.value;if(v===''||isNaN(parseFloat(v))){setNumErrs(prev=>({...prev,[field]:'Must be a number'}));return;}setNumErrs(prev=>({...prev,[field]:''}));setField(field,isInt?parseInt(v):parseFloat(v));}}
            className={`w-24 px-2 py-0.5 text-xs border rounded text-right focus:outline-none focus:ring-1 ${err?'border-red-400 bg-red-50':'border-slate-200 focus:ring-blue-400'}`}/>
          {err&&<span className="text-[9px] text-red-500">{err}</span>}
        </div>
      </div>
    );
  };
  return(
    <div className="border border-slate-200 rounded-lg mb-1.5 overflow-hidden">
      <div className="flex items-center bg-slate-50 px-3 py-1.5">
        <button onClick={()=>setOpen(o=>!o)} className="flex-1 text-left text-xs font-semibold text-slate-700">{open?'▼':'▶'}&nbsp;{roi}</button>
        <button onClick={onRemove} className="text-red-400 hover:text-red-600 text-[11px] px-1.5 py-0.5 rounded hover:bg-red-50">✕ Remove</button>
      </div>
      {open&&(
        <div className="px-3 py-2">
          {numField('n_lesions','n_lesions',1,true)}
          <div className="flex items-center justify-between py-1.5 border-b border-slate-50 gap-2">
            <span className="text-xs font-medium text-slate-600">prob</span>
            <select value={spec.prob||'uniform'} onChange={e=>setField('prob',e.target.value)}
              className="px-2 py-0.5 text-xs border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-blue-400 bg-white">
              {PROB_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          </div>
          {spec.prob==='gaussian'&&numField('sigma_mm','sigma_mm',1,false)}
          {spec.prob==='user_defined'&&(
            <UserDefinedInputs
              nLesions={spec.n_lesions||1}
              centers={spec.user_centers_zyx||[]}
              radii={spec.radii_mm||[]}
              onUpdateCenters={v=>onUpdateSpec({...spec,user_centers_zyx:v})}
              onUpdateRadii={v=>onUpdateSpec({...spec,radii_mm:v})}/>
          )}
          {numField('margin_mm','margin_mm',0.1,false)}
          {numField('seed','seed',1,true)}
        </div>
      )}
    </div>
  );
}

function SpecsEditor({value,onChange,roiChoices,desc}){
  const [showDesc,setShowDesc]=useState(false);
  const [addRoi,setAddRoi]=useState('');
  const isDisabled=value===null;
  const specs=value||{};
  const usedRois=Object.keys(specs);
  const available=(roiChoices||[]).filter(r=>r!=='body'&&!usedRois.includes(r));
  const handleAdd=()=>{if(!addRoi)return;onChange({...specs,[addRoi]:{n_lesions:1,prob:'uniform',margin_mm:1.0,seed:0}});setAddRoi('');};
  const handleUpdateSpec=(roi,newSpec)=>onChange({...specs,[roi]:newSpec});
  const handleRemove=(roi)=>{const u={...specs};delete u[roi];onChange(Object.keys(u).length?u:null);};
  return(
    <div className="py-2 border-b border-slate-100 last:border-0">
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-1.5">
          <span className="text-sm font-medium text-slate-700">specs</span>
          <span className="text-[10px] text-slate-400 bg-slate-100 px-1.5 rounded font-mono">per-organ lesion config</span>
          {desc&&<button onClick={()=>setShowDesc(s=>!s)} className="text-slate-300 hover:text-blue-400 text-[10px] w-3.5 h-3.5 rounded-full border border-current flex items-center justify-center leading-none">?</button>}
        </div>
        {isDisabled
          ?<button onClick={()=>onChange({})} className="text-xs text-blue-600 hover:text-blue-800 border border-blue-200 hover:border-blue-400 px-2 py-0.5 rounded-lg">+ Enable specs</button>
          :<button onClick={()=>onChange(null)} className="text-xs text-red-400 hover:text-red-600 border border-red-200 hover:border-red-400 px-2 py-0.5 rounded-lg">✕ Disable all</button>
        }
      </div>
      {showDesc&&<p className="text-xs text-slate-400 mb-2 leading-relaxed">{desc}</p>}
      {isDisabled?(
        <p className="text-xs text-slate-400 italic">No specs — lesions will not be inserted.</p>
      ):(
        <>
          {usedRois.length===0&&<p className="text-xs text-slate-400 italic mb-2">No ROIs configured yet — add one below.</p>}
          {usedRois.map(roi=>(
            <SpecRoiCard key={roi} roi={roi} spec={specs[roi]}
              onUpdateSpec={ns=>handleUpdateSpec(roi,ns)} onRemove={()=>handleRemove(roi)}/>
          ))}
          {available.length>0?(
            <div className="flex items-center gap-2 mt-2">
              <select value={addRoi} onChange={e=>setAddRoi(e.target.value)}
                className="flex-1 px-2 py-1 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-400 bg-white">
                <option value="">Select ROI to add…</option>
                {available.map(r=><option key={r} value={r}>{r}</option>)}

              <button onClick={handleAdd} disabled={!addRoi}
                className="px-3 py-1 text-xs bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed font-semibold">
                + Add
              </button>
            </div>
          ):(
            <p className="text-xs text-slate-400 italic mt-2">
              {(roiChoices||[]).filter(r=>r!=='body').length===0
                ?'Select Phase 1 ROIs first to unlock lesion placement options.'
                :'All available ROIs are already configured.'}
            </p>
          )}
        </>
      )}
    </div>
  );
}

// ─── FrameTimesSection ────────────────────────────────────────────────────────
function FrameTimesSection({frameStartTimes,frameDurations,basePath,patientName,onChange}){
  const toStr=v=>(v===undefined||v===null)?'':String(v);
  const init=()=>{
    const fst=Array.isArray(frameStartTimes)?frameStartTimes:[];
    const fd=Array.isArray(frameDurations)?frameDurations:[];
    const n=Math.max(fst.length,fd.length,1);
    return Array.from({length:n},(_,i)=>({start:toStr(fst[i]),dur:toStr(fd[i])}));
  };
  const [rows,setRows]=useState(init);
  const [errs,setErrs]=useState([]);
  const validate=r=>{const e=[];r.forEach((row,i)=>{if(row.start===''||isNaN(Number(row.start)))e.push({i,f:'start'});if(row.dur===''||isNaN(Number(row.dur)))e.push({i,f:'dur'});});return e;};
  const commit=nr=>{const e=validate(nr);setErrs(e);if(!e.length){onChange(patientName,[...basePath,'FrameStartTimes'],nr.map(r=>Number(r.start)));onChange(patientName,[...basePath,'FrameDurations'],nr.map(r=>Number(r.dur)));}};
  const set=(i,f,v)=>{const nr=rows.map((r,ri)=>ri===i?{...r,[f]:v}:r);setRows(nr);commit(nr);};
  const addRow=()=>{const r=[...rows,{start:'',dur:''}];setRows(r);setErrs(validate(r));};
  const delRow=i=>{const r=rows.filter((_,ri)=>ri!==i)||[{start:'',dur:''}];if(!r.length)r.push({start:'',dur:''});setRows(r);commit(r);};
  const errFor=(i,f)=>errs.find(e=>e.i===i&&e.f===f);
  return(
    <div className="py-2 border-b border-slate-100 last:border-0">
      <div className="flex items-center justify-between mb-2">
        <span className="text-sm font-medium text-slate-700">Acquisition Frames</span>
        <button onClick={addRow} className="text-xs text-blue-600 hover:text-blue-800 border border-blue-200 hover:border-blue-400 px-2 py-0.5 rounded-lg font-medium">+ Add frame</button>
      </div>
      {errs.length>0&&<p className="text-xs text-red-500 mb-1.5">Fix errors — pipeline will reject non-numeric values.</p>}
      <table className="w-full text-xs">
        <thead><tr className="text-slate-400 text-[11px]">
          <th className="text-left pb-1 pr-2 font-medium w-8">#</th>
          <th className="text-left pb-1 pr-2 font-medium">Start time (min p.i.)</th>
          <th className="text-left pb-1 pr-2 font-medium">Duration (sec)</th>
          <th className="w-6"></th>
        </tr></thead>
        <tbody>
          {rows.map((row,i)=>{
            const eS=errFor(i,'start'),eD=errFor(i,'dur');
            return(
              <tr key={i} className="border-t border-slate-50">
                <td className="py-1 pr-2 text-slate-400 font-mono">{i+1}</td>
                <td className="py-1 pr-2">
                  <input type="number" value={row.start} onChange={e=>set(i,'start',e.target.value)} onBlur={e=>set(i,'start',e.target.value)}
                    className={`w-32 px-2 py-0.5 border rounded text-right focus:outline-none focus:ring-1 ${eS?'border-red-400 bg-red-50':'border-slate-200 focus:ring-blue-400'}`}/>
                  {eS&&<p className="text-[9px] text-red-500">Number required</p>}
                </td>
                <td className="py-1 pr-2">
                  <input type="number" value={row.dur} onChange={e=>set(i,'dur',e.target.value)} onBlur={e=>set(i,'dur',e.target.value)}
                    className={`w-24 px-2 py-0.5 border rounded text-right focus:outline-none focus:ring-1 ${eD?'border-red-400 bg-red-50':'border-slate-200 focus:ring-blue-400'}`}/>
                  {eD&&<p className="text-[9px] text-red-500">Number required</p>}
                </td>
                <td className="py-1">{rows.length>1&&<button onClick={()=>delRow(i)} className="text-red-400 hover:text-red-600 text-[11px] px-1">✕</button>}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ─── FieldRenderer ────────────────────────────────────────────────────────────
function FieldRenderer({fieldKey,value,path,patientName,onChange,descriptions,pipelineOptions,roiChoices,patientShape}){
  const desc=descriptions[fieldKey]||'';
  const [showDesc,setShowDesc]=useState(false);
  const [numErr,setNumErr]=useState('');
  const call=v=>onChange(patientName,path,v);
  const LabelRow=({children})=>(
    <div className="flex items-center justify-between py-2 border-b border-slate-100 last:border-0 gap-3">
      <div className="flex items-center gap-1.5 flex-shrink-0">
        <span className="text-sm font-medium text-slate-700">{fieldKey}</span>
        {desc&&<button onClick={()=>setShowDesc(s=>!s)} className="text-slate-300 hover:text-blue-400 text-[10px] w-3.5 h-3.5 rounded-full border border-current flex items-center justify-center leading-none">?</button>}
      </div>
      {children}
    </div>
  );
  const DescLine=()=>showDesc?<p className="text-xs text-slate-400 pb-2 -mt-1 leading-relaxed">{desc}</p>:null;

  if(fieldKey==='xyz_dim') return<XyzDimFieldInner value={value} onChange={call} desc={desc} patientShape={patientShape}/>;
  if(fieldKey==='random_seed') return<RandomSeedField value={value} onChange={call} desc={desc}/>;
  if(typeof value==='boolean') return<><LabelRow><input type="checkbox" checked={value} onChange={e=>call(e.target.checked)} className="w-4 h-4 accent-blue-600 flex-shrink-0"/></LabelRow><DescLine/></>;
  if(typeof value==='number') return(
    <><LabelRow>
      <div className="flex flex-col items-end gap-0.5">
        <input type="number" defaultValue={value}
          onChange={e=>{setNumErr(e.target.value!==''&&isNaN(parseFloat(e.target.value))?'Must be a number':'');}}
          onBlur={e=>{const v=e.target.value;if(v===''||isNaN(parseFloat(v))){setNumErr('Must be a number');}else{setNumErr('');call(parseFloat(v));}}}
          className={`w-32 px-2 py-1 text-sm border rounded-lg text-right focus:outline-none focus:ring-2 ${numErr?'border-red-400 focus:ring-red-300 bg-red-50':'border-slate-300 focus:ring-blue-400'}`}/>
        {numErr&&<span className="text-xs text-red-500">{numErr}</span>}
      </div>
    </LabelRow><DescLine/></>
  );
  if(value===null) return<><LabelRow><NullField call={call}/></LabelRow><DescLine/></>;
  if(typeof value==='string'){
    const opts=pipelineOptions&&pipelineOptions[fieldKey];
    if(opts&&Array.isArray(opts)) return(
      <><LabelRow>
        <select value={value} onChange={e=>call(e.target.value)}
          className="px-2 py-1 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
          {opts.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </LabelRow><DescLine/></>
    );
    return<><LabelRow><input type="text" defaultValue={value} onBlur={e=>call(e.target.value)} className="w-44 px-2 py-1 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"/></LabelRow><DescLine/></>;
  }
  if(Array.isArray(value)){
    if(fieldKey==='roi_subset'&&roiChoices&&roiChoices.length>0){
      const choices=roiChoices.filter(r=>r!=='body');
      return(
        <div className="py-2 border-b border-slate-100 last:border-0">
          <div className="flex items-center gap-1.5 mb-2">
            <span className="text-sm font-medium text-slate-700">{fieldKey}</span>
            {desc&&<button onClick={()=>setShowDesc(s=>!s)} className="text-slate-300 hover:text-blue-400 text-[10px] w-3.5 h-3.5 rounded-full border border-current flex items-center justify-center leading-none">?</button>}
          </div>
          <DescLine/>
          {choices.length===0&&<p className="text-xs text-slate-400 italic">No ROIs available — constrained by Phase 1 selection</p>}
          <div className="flex flex-wrap gap-1.5">
            {choices.map(roi=>(
              <label key={roi} className={`px-2 py-0.5 rounded-full text-xs cursor-pointer border select-none transition-colors
                ${value.includes(roi)?'bg-blue-100 border-blue-400 text-blue-700':'bg-slate-100 border-slate-300 text-slate-500 hover:border-slate-400'}`}>
                <input type="checkbox" checked={value.includes(roi)}
                  onChange={e=>call(e.target.checked?[...value,roi]:value.filter(r=>r!==roi))} className="hidden"/>
                {roi}
              </label>
            ))}
          </div>
        </div>
      );
    }
    return(
      <><LabelRow>
        <textarea key={JSON.stringify(value)} defaultValue={value.join(', ')}
          onBlur={e=>{const parts=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);call(parts.map(p=>{const n=Number(p);return isNaN(n)?p:n;}));}}
          rows={2} className="w-56 px-2 py-1 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"/>
      </LabelRow><DescLine/></>
    );
  }
  return null;
}

// ─── StageSection ─────────────────────────────────────────────────────────────
function StageSection({stageKey,stageData,basePath,patientName,onChange,descriptions,pipelineOptions,roiChoices,patientShape}){

  const entries=Object.entries(stageData).filter(([k])=>
    !DEVELOPER_FIELDS.has(k)&&
    !(isSpectPost&&(k==='FrameStartTimes'||k==='FrameDurations'))&&
    !(isSynLesion&&k==='specs')
  );
  return(
    <div className="border border-slate-100 rounded-lg overflow-hidden">
      <button onClick={()=>setOpen(o=>!o)}
        className="w-full flex items-center justify-between px-4 py-2.5 hover:bg-slate-50 transition-colors text-left">
        <span className="text-sm font-medium text-slate-600">{STAGE_LABELS[stageKey]||stageKey}</span>
        <span className="text-slate-300 text-xs">{open?'▲':'▼'}</span>
      </button>
      {open&&(
        <div className="px-4 pb-3">
          {entries.map(([k,v])=>{
            const fPath=[...basePath,k];
            if(typeof v==='object'&&v!==null&&!Array.isArray(v)){
              const sub=Object.entries(v).filter(([sk])=>!DEVELOPER_FIELDS.has(sk));

              return(
                <div key={k} className="mt-3">
                  <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">{STAGE_LABELS[k]||k}</p>
                  <div className="pl-3 border-l-2 border-slate-100">
                    {sub.map(([sk,sv])=>(
                      <FieldRenderer key={sk} fieldKey={sk} value={sv} path={[...fPath,sk]}
                        patientName={patientName} onChange={onChange} descriptions={descriptions}
                        pipelineOptions={pipelineOptions} roiChoices={roiChoices} patientShape={patientShape}/>
                    ))}
                  </div>
                </div>
              );
            }
            return<FieldRenderer key={k} fieldKey={k} value={v} path={fPath}
              patientName={patientName} onChange={onChange} descriptions={descriptions}
              pipelineOptions={pipelineOptions} roiChoices={roiChoices} patientShape={patientShape}/>;
          })}

              roiChoices={roiChoices} desc={descriptions['specs']||''}/>
          )}
          {isSpectPost&&'FrameStartTimes' in stageData&&'FrameDurations' in stageData&&(
            <FrameTimesSection frameStartTimes={stageData.FrameStartTimes}
              frameDurations={stageData.FrameDurations}
              basePath={basePath} patientName={patientName} onChange={onChange}/>
          )}
        </div>
      )}
    </div>
  );
}

// ─── PhaseSection ─────────────────────────────────────────────────────────────
function PhaseSection({phaseKey,phaseData,patientName,onChange,descriptions,pipelineOptions,roiChoices,phase1RoiSubset,patientShape,flags}){
  const [open,setOpen]=useState(false);
  const stages=Object.entries(phaseData).filter(([k,v])=>{
    if(k==='sub_dir_name'||typeof v!=='object'||v===null) return false;
    // Hide synthetic_lesions_stage entirely when the flag is off
    if(k==='synthetic_lesions_stage'&&!flags?.synthetic_lesions) return false;
    return true;
  });
  // Constrain to phase_1 selection for all non-segmentation stages
  const constrained=(Array.isArray(phase1RoiSubset)&&phase1RoiSubset.length>0)
    ?roiChoices.filter(r=>phase1RoiSubset.includes(r))
    :roiChoices;
  return(
    <div className="border border-slate-200 rounded-xl overflow-hidden">
      <button onClick={()=>setOpen(o=>!o)}
        className="w-full flex items-center justify-between px-4 py-3 bg-slate-50 hover:bg-slate-100 transition-colors text-left">
        <span className="text-sm font-semibold text-slate-700">{PHASE_LABELS[phaseKey]||phaseKey}</span>
        <span className="text-slate-400 text-xs">{open?'▲':'▼'}</span>
      </button>
      {open&&(
        <div className="p-3 space-y-2">
          {stages.map(([sk,sd])=>(
            <StageSection key={sk} stageKey={sk} stageData={sd}
              basePath={[phaseKey,sk]} patientName={patientName} onChange={onChange}
              descriptions={descriptions} pipelineOptions={pipelineOptions}
              // segmentation_stage sees full choices; everything else is constrained
              roiChoices={sk==='segmentation_stage'?roiChoices:constrained}
              patientShape={patientShape}/>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Page 3 ───────────────────────────────────────────────────────────────────
function Page3Configure({patients,projectName,setProjectName,projectDirs,setProjectDirs,
                         patientConfigs,setPatientConfigs,flags,setFlags,mode,setMode,
                         patientShapes,onNext,onBack}){
  const [dirsCreated,setDirsCreated]=useState(Object.keys(projectDirs).length>0);
  const [creating,setCreating]=useState(false);
  const [createError,setCreateError]=useState('');
  const [configMeta,setConfigMeta]=useState(null);
  const [applyToAll,setApplyToAll]=useState(false);
  const [openCards,setOpenCards]=useState({});
  const saveTimers=useRef({});

  useEffect(()=>{
    apiFetch('/api/config-template').then(r=>r.json()).then(d=>{
      setConfigMeta(d);
      if(Object.keys(patientConfigs).length===0&&d.template){
        const init={};patients.forEach(p=>{init[p.name]=JSON.parse(JSON.stringify(d.template));});
        setPatientConfigs(init);
      }
    }).catch(console.error);
  },[]);

  const createDirs=async()=>{
    if(!projectName.trim()){setCreateError('Enter a project name first.');return;}
    setCreating(true);setCreateError('');
    try{
      const res=await apiFetch('/api/create-output-dirs',{method:'POST',body:JSON.stringify({project_name:projectName.trim(),patients})});
      if(!res.ok){const err=await res.json();setCreateError(err.detail||'Failed');setCreating(false);return;}
      const data=await res.json();
      setProjectDirs(data.dirs);setDirsCreated(true);
      setPatientConfigs(prev=>{const u={...prev};Object.keys(u).forEach(nm=>{u[nm]={...u[nm],output_folder_title:projectName.trim()};});return u;});
    }catch(e){setCreateError('Error: '+e.message);}
    setCreating(false);
  };

  const handleConfigChange=useCallback((patientName,path,value)=>{
    setPatientConfigs(prev=>{
      const tmpl=configMeta?.template||{};
      const updated={...prev};
      updated[patientName]=deepSet(updated[patientName]||tmpl,path,value);
      const isP1Roi=path[0]==='phase_1'&&path[path.length-1]==='roi_subset';
      if(isP1Roi){
        const p1Set=new Set(value);
        const trimRoi=(cfg,ph,st)=>{const cur=cfg?.[ph]?.[st]?.roi_subset;return Array.isArray(cur)?deepSet(cfg,[ph,st,'roi_subset'],cur.filter(r=>p1Set.has(r))):cfg;};
        updated[patientName]=trimRoi(updated[patientName],'phase_2','simind_stage');
        updated[patientName]=trimRoi(updated[patientName],'phase_2','opengate_stage');
        // Also trim specs keys that are no longer in roi_subset
        const specs=updated[patientName]?.phase_1?.synthetic_lesions_stage?.specs;
        if(specs&&typeof specs==='object'){
          const newSpecs={};Object.keys(specs).forEach(k=>{if(p1Set.has(k))newSpecs[k]=specs[k];});
          updated[patientName]=deepSet(updated[patientName],['phase_1','synthetic_lesions_stage','specs'],Object.keys(newSpecs).length?newSpecs:null);
        }
      }
      const toSync=applyToAll?patients.filter(p=>p.name!==patientName):[];
      toSync.forEach(p=>{
        updated[p.name]=deepSet(updated[p.name]||tmpl,path,value);
        if(isP1Roi){
          const p1Set=new Set(value);
          const trimRoi=(cfg,ph,st)=>{const cur=cfg?.[ph]?.[st]?.roi_subset;return Array.isArray(cur)?deepSet(cfg,[ph,st,'roi_subset'],cur.filter(r=>p1Set.has(r))):cfg;};
          updated[p.name]=trimRoi(updated[p.name],'phase_2','simind_stage');
          updated[p.name]=trimRoi(updated[p.name],'phase_2','opengate_stage');
          const specs=updated[p.name]?.phase_1?.synthetic_lesions_stage?.specs;
          if(specs&&typeof specs==='object'){
            const ns={};Object.keys(specs).forEach(k=>{if(p1Set.has(k))ns[k]=specs[k];});
            updated[p.name]=deepSet(updated[p.name],['phase_1','synthetic_lesions_stage','specs'],Object.keys(ns).length?ns:null);
          }
        }
      });
      const saveOne=async(nm)=>{const dir=projectDirs[nm];if(!dir)return;try{await apiFetch('/api/save-patient-config',{method:'POST',body:JSON.stringify({output_dir:dir,config:updated[nm]})});}catch(e){console.error('Auto-save failed:',e);}};
      clearTimeout(saveTimers.current[patientName]);
      saveTimers.current[patientName]=setTimeout(()=>{saveOne(patientName);toSync.forEach(p=>saveOne(p.name));},500);
      return updated;
    });
  },[patients,projectDirs,applyToAll,configMeta]);

  const handleFlagChange=(key,checked)=>{
    setFlags(prev=>({...prev,[key]:checked}));
    // When synthetic_lesions is turned OFF, immediately clear specs from all patient configs
    if(key==='synthetic_lesions'&&!checked){
      setPatientConfigs(prev=>{
        const updated={...prev};
        Object.keys(updated).forEach(nm=>{
          if(updated[nm]?.phase_1?.synthetic_lesions_stage){
            updated[nm]=deepSet(updated[nm],['phase_1','synthetic_lesions_stage','specs'],null);
          }
        });
        return updated;
      });
    }
  };

  const roiChoices=(configMeta?.roi_choices||[]).filter(r=>r!=='body');

  return(
    <div className="max-w-4xl mx-auto px-6 py-8">
      <div className="flex items-center gap-3 mb-6">
        <button onClick={onBack} className="text-slate-400 hover:text-slate-600 text-sm flex items-center gap-1">← Back</button>
        <h2 className="text-2xl font-bold text-slate-900">Configure Pipeline</h2>
      </div>

      {/* Project name */}
      <div className="bg-white border border-slate-200 rounded-2xl p-6 mb-5 shadow-sm">
        <h3 className="font-semibold text-slate-800 mb-1">Project Name</h3>
        <p className="text-xs text-slate-500 mb-4">Creates <code className="bg-slate-100 px-1 rounded">{'{name}'}_CT_1</code>, … directories in the repo root.</p>
        <div className="flex gap-3 items-start">
          <input type="text" value={projectName} onChange={e=>setProjectName(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!dirsCreated)createDirs();}} placeholder="e.g. my_study" disabled={dirsCreated}
            className="flex-1 px-3 py-2 border border-slate-300 rounded-xl terminal-font text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:text-slate-400"/>
          {!dirsCreated
            ?<button onClick={createDirs} disabled={creating||!projectName.trim()}
                className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl font-semibold text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm whitespace-nowrap">
                {creating?<><span className="spin">⟳</span>&nbsp;Creating…</>:'Create Output Dirs'}
              </button>
            :<span className="flex items-center gap-1.5 text-emerald-600 font-semibold text-sm px-3 py-2 whitespace-nowrap">✓ Created</span>
          }
        </div>
        {createError&&<p className="mt-2 text-sm text-red-600">{createError}</p>}
        {dirsCreated&&<div className="mt-3 space-y-0.5">{patients.map((p,i)=><p key={p.name} className="text-xs terminal-font text-slate-400">✓ {projectDirs[p.name]||`${projectName}_CT_${i+1}`}</p>)}</div>}
      </div>

      {/* Pipeline Options */}
      <div className="bg-white border border-slate-200 rounded-2xl p-6 mb-5 shadow-sm">
        <h3 className="font-semibold text-slate-800 mb-1">Pipeline Options</h3>
        <p className="text-xs text-slate-500 mb-4">Select which stages to run.</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-5">
          {CLI_FLAGS.map(({key,label,desc})=>(
            <label key={key} className={`flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition-colors select-none
              ${flags[key]?'border-blue-400 bg-blue-50':'border-slate-200 hover:border-slate-300 bg-white'}`}>
              <input type="checkbox" checked={!!flags[key]} onChange={e=>handleFlagChange(key,e.target.checked)}
                className="mt-0.5 w-4 h-4 accent-blue-600 flex-shrink-0"/>
              <div><p className="font-semibold text-slate-800 text-sm">{label}</p>
                <p className="text-xs text-slate-500 mt-0.5 leading-snug">{desc}</p></div>
            </label>
          ))}
        </div>
        <div className="border-t border-slate-100 pt-4 flex items-center gap-4 flex-wrap">
          <span className="text-sm font-semibold text-slate-700 flex-shrink-0">Run Mode</span>
          <div className="flex gap-2">
            {['PRODUCTION','DEBUG'].map(m=>(
              <button key={m} onClick={()=>setMode(m)}
                className={`px-5 py-1.5 rounded-lg text-sm font-semibold border transition-colors
                  ${mode===m?(m==='PRODUCTION'?'bg-emerald-600 text-white border-emerald-600':'bg-amber-500 text-white border-amber-500'):'bg-white text-slate-600 border-slate-300 hover:border-slate-400'}`}>
                {m}
              </button>
            ))}
          </div>
          <span className="text-xs text-slate-400">{mode==='DEBUG'?'Reduced iterations — faster testing':'Full production-quality simulation'}</span>
        </div>
      </div>

      {/* Per-patient config */}
      {dirsCreated&&configMeta&&(
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
          <div className="flex items-center justify-between mb-1">
            <h3 className="font-semibold text-slate-800">Per-Patient Configuration</h3>
            <label className="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" checked={applyToAll} onChange={e=>setApplyToAll(e.target.checked)} className="w-4 h-4 accent-blue-600"/>
              <span className="text-slate-600 text-sm">Sync all patients</span>
            </label>
          </div>
          <p className="text-xs text-slate-400 mb-4">Changes auto-save to each config.json. Phase 2 ROI pickers and lesion specs are constrained to Phase 1 selection.</p>
          <div className="space-y-2">
            {patients.map((p,i)=>{
              const cfg=patientConfigs[p.name]||configMeta.template;
              const cardOpen=!!openCards[p.name];
              const shape=patientShapes[p.name]||null;
              // Phase 1 segmentation roi_subset is the source of truth for all ROI constraints
              const p1RoiSubset=cfg?.phase_1?.segmentation_stage?.roi_subset??null;
              return(
                <div key={p.name} className="border border-slate-200 rounded-xl overflow-hidden">
                  <button onClick={()=>setOpenCards(prev=>({...prev,[p.name]:!prev[p.name]}))}
                    className="w-full flex items-center justify-between px-4 py-3 bg-slate-50 hover:bg-slate-100 transition-colors text-left">
                    <span className="font-semibold text-slate-700 text-sm">CT_{i+1} — {p.name}</span>
                    <span className="text-slate-400 text-xs">{cardOpen?'▲':'▼'}</span>
                  </button>
                  {cardOpen&&(
                    <div className="p-4 space-y-3">
                      {['phase_1','phase_2','phase_3'].map(pk=>cfg[pk]?(
                        <PhaseSection key={pk} phaseKey={pk} phaseData={cfg[pk]}
                          patientName={p.name} onChange={handleConfigChange}
                          descriptions={configMeta.field_descriptions||{}}
                          pipelineOptions={configMeta.pipeline_options||{}}
                          roiChoices={roiChoices}
                          phase1RoiSubset={p1RoiSubset}
                          patientShape={shape}
                          flags={flags}/>
                      ):null)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="mt-6 flex justify-end">
        <button onClick={onNext} disabled={!dirsCreated}
          className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold text-base transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-sm">
          Continue to Run →
        </button>
      </div>
    </div>
  );
}

// ─── Config Summary Card (per patient) ───────────────────────────────────────
function ConfigSummaryCard({patient,cfg,flags,projectDir}){
  const ph1=cfg?.phase_1;const ph2=cfg?.phase_2;const ph3=cfg?.phase_3;
  const tac=ph1?.pbpk_tac_stage;
  const synth=ph1?.synthetic_lesions_stage;
  const simind=ph2?.simind_stage;
  const og=ph2?.opengate_stage;
  const pp=ph3?.spect_postprocess_stage;

  const kv=(label,val)=>{
    if(val===undefined||val===null)return null;
    const display=Array.isArray(val)?(val.length?val.join(', '):'—'):String(val);
    return(
      <div className="flex gap-2 text-xs py-0.5">
        <span className="text-slate-400 w-36 shrink-0">{label}</span>
        <span className="text-slate-700 font-medium break-all">{display}</span>
      </div>
    );
  };

  const Section=({title,children})=>(
    <div className="mb-3">
      <p className="text-[10px] uppercase tracking-widest text-slate-400 font-semibold mb-1">{title}</p>
      <div className="bg-slate-50 rounded-xl px-3 py-2 space-y-0.5">{children}</div>
    </div>
  );

  const Badge=({label,color})=>{
    const c={blue:'bg-blue-100 text-blue-700',purple:'bg-purple-100 text-purple-700',
              teal:'bg-teal-100 text-teal-700',orange:'bg-orange-100 text-orange-700'}[color]||'bg-slate-100 text-slate-600';
    return <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${c}`}>{label}</span>;
  };

  return(
    <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
      <div className="flex items-start justify-between gap-3 mb-3">
        <span className="font-semibold text-slate-800 text-base">{patient.name}</span>
        {projectDir&&<span className="text-[10px] terminal-font text-slate-400 truncate max-w-xs">{projectDir}</span>}
      </div>
      <div className="flex flex-wrap gap-1.5 mb-4">
        {flags.spect&&<Badge label="SPECT Simulation" color="blue"/>}
        {flags.dosimetry&&<Badge label="Dosimetry" color="purple"/>}
        {flags.postprocess&&<Badge label="Post-Processing" color="teal"/>}
        {flags.synthetic_lesions&&<Badge label="Synthetic Lesions" color="orange"/>}
      </div>

      {tac&&(
        <Section title="PBPK TAC (Phase 1)">
          {kv('Model type', tac.ModelType||tac.model_type)}
          {kv('Isotope', tac.Isotope||tac.isotope)}
          {kv('ROI subset', tac.roi_subset)}
        </Section>
      )}
      {flags.synthetic_lesions&&synth&&(
        <Section title="Synthetic Lesions (Phase 1)">
          {kv('Organ specs', synth.specs?Object.keys(synth.specs).join(', '):'—')}
        </Section>
      )}
      {flags.spect&&simind&&(
        <Section title="SIMIND Simulation (Phase 2)">
          {kv('Collimator', simind.Collimator||simind.collimator)}
          {kv('Projections', simind.NumProjections||simind.num_projections)}
          {kv('ROI subset', simind.roi_subset)}
        </Section>
      )}
      {flags.dosimetry&&og&&(
        <Section title="OpenGATE Dosimetry (Phase 2)">
          {kv('ROI subset', og.roi_subset)}
        </Section>
      )}
      {flags.postprocess&&pp&&(
        <Section title="Post-Processing (Phase 3)">
          {kv('Algorithm', pp.ReconstructionAlgorithm||pp.reconstruction_algorithm)}
          {kv('Subsets', pp.Subsets||pp.num_subsets)}
          {kv('Iterations', pp.Iterations||pp.num_iterations)}
          {kv('Apply TAC', pp.apply_tac?'Yes':'No')}
          {kv('Apply Noise', pp.apply_poisson_noise?'Yes':'No')}
          {kv('Apply Reconstruction', pp.apply_reconstruction?'Yes':'No')}
        </Section>
      )}
    </div>
  );
}

// ─── Page 4 ───────────────────────────────────────────────────────────────────
function Page4Run({patients,projectName,projectDirs,flags,mode,patientConfigs,onBack}){
  const [status,setStatus]=useState('idle'); // idle | starting | launched | error
  const [errorMsg,setErrorMsg]=useState('');
  const [validation,setValidation]=useState(null);

  // Pre-run validation
  useEffect(()=>{
    const issues=[];
    if(!projectName.trim()) issues.push('Project name is empty');
    if(!patients.length)    issues.push('No patients selected');
    patients.forEach(p=>{
      if(!projectDirs[p.name]) issues.push(`Missing output directory for "${p.name}"`);
      const cfg=patientConfigs?.[p.name];
      if(!cfg) return;
      // FrameStartTimes / FrameDurations
      const fst=cfg?.phase_3?.spect_postprocess_stage?.FrameStartTimes;
      const fd =cfg?.phase_3?.spect_postprocess_stage?.FrameDurations;
      if(Array.isArray(fst)&&Array.isArray(fd)){
        if(fst.length!==fd.length) issues.push(`[${p.name}] FrameStartTimes (${fst.length}) ≠ FrameDurations (${fd.length})`);
        fst.forEach((v,i)=>{if(typeof v!=='number'||isNaN(v)) issues.push(`[${p.name}] FrameStartTimes[${i}] must be a number`);});
        fd.forEach((v,i)=>{ if(typeof v!=='number'||isNaN(v)) issues.push(`[${p.name}] FrameDurations[${i}] must be a number`);});
      }
      // Synthetic lesions: at least 1 spec required
      if(flags.synthetic_lesions){
        const specs=cfg?.phase_1?.synthetic_lesions_stage?.specs;
        if(!specs||typeof specs!=='object'||Object.keys(specs).length===0)
          issues.push(`[${p.name}] Synthetic Lesions is ON but no organ specs are configured — add at least one spec in Phase 1`);
      }
      // Post-processing + SPECT: at least one option enabled
      if(flags.postprocess&&flags.spect){
        const pp=cfg?.phase_3?.spect_postprocess_stage;
        if(pp&&!pp.apply_tac&&!pp.apply_poisson_noise&&!pp.apply_reconstruction)
          issues.push(`[${p.name}] Post-Processing + SPECT: enable at least one of Apply TAC, Apply Noise, or Apply Reconstruction`);
      }
      // Dosimetry: at least one ROI in opengate
      if(flags.dosimetry){
        const roi=cfg?.phase_2?.opengate_stage?.roi_subset;
        if(!Array.isArray(roi)||roi.length===0)
          issues.push(`[${p.name}] Dosimetry is ON but no ROIs are selected in the OpenGATE stage`);
      }
    });
    setValidation({ok:!issues.length,issues});
  },[patientConfigs,flags,patients,projectName,projectDirs]);

  const startRun=async()=>{
    setStatus('starting');setErrorMsg('');
    try{
      const res=await apiFetch('/api/run',{method:'POST',body:JSON.stringify({project_name:projectName,patients,project_dirs:projectDirs,flags,mode})});
      if(!res.ok){const err=await res.json();setErrorMsg(err.detail||'Unknown server error');setStatus('error');return;}
      setStatus('launched');
    }catch(e){setErrorMsg(e.message);setStatus('error');}
  };

  const canRun=validation?.ok&&status==='idle';

  // ── Launched screen ────────────────────────────────────────────────────────
  if(status==='launched'){
    return(
      <div className="max-w-lg mx-auto px-6 py-24 text-center">
        <h2 className="text-2xl font-bold text-slate-900 mb-3">Pipeline Started</h2>
        <p className="text-slate-500 mb-8 leading-relaxed">
          The pipeline is now running in the terminal where you launched{' '}
          <code className="bg-slate-100 px-1.5 py-0.5 rounded text-sm font-mono">python run_server.py</code>.
          Monitor progress there.
        </p>
        <div className="bg-slate-100 border border-slate-200 rounded-2xl px-6 py-5 mb-8 text-left">
          <p className="text-slate-700 font-semibold mb-2 text-sm">Output directories</p>
          {patients.map(p=>(
            <div key={p.name} className="text-xs terminal-font text-slate-500 break-all mb-1">
              <span className="font-semibold text-slate-600">{p.name}:</span> {projectDirs[p.name]||'—'}
            </div>
          ))}
        </div>
        <p className="text-slate-500 text-sm">You can close this tab — the pipeline will continue running.</p>
      </div>
    );
  }

  // ── Main review + run screen ───────────────────────────────────────────────
  return(
    <div className="max-w-4xl mx-auto px-6 py-8">
      <div className="flex items-center gap-3 mb-6">
        <button onClick={onBack}
          className="text-slate-400 hover:text-slate-600 text-sm flex items-center gap-1">
          ← Back
        </button>
        <h2 className="text-2xl font-bold text-slate-900">Review & Run</h2>
      </div>

      {/* Validation panel */}
      {validation&&(
        <div className={`rounded-2xl p-4 mb-6 border ${validation.ok?'bg-emerald-50 border-emerald-200':'bg-red-50 border-red-200'}`}>
          <p className={`font-semibold mb-2 ${validation.ok?'text-emerald-800':'text-red-700'}`}>
            {validation.ok?'✓ All checks passed — ready to run':'✗ Fix these issues before running'}
          </p>
          {validation.ok?(
            <div className="text-sm text-emerald-700 space-y-0.5">
              <p>· {patients.length} patient{patients.length!==1?'s':''} queued</p>
              <p>· Mode: <span className="font-semibold">{mode}</span></p>
              <p>· Logging: <span className="font-semibold">{flags.logging_on?'On':'Off'}</span></p>
            </div>
          ):(
            <ul className="space-y-1">{validation.issues.map((iss,i)=><li key={i} className="text-sm text-red-700">· {iss}</li>)}</ul>
          )}
        </div>
      )}

      {/* Per-patient config summary */}
      <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-3">Configuration Summary</h3>
      <div className="space-y-4 mb-8">
        {patients.map(p=>(
          <ConfigSummaryCard key={p.name} patient={p} cfg={patientConfigs?.[p.name]}
            flags={flags} projectDir={projectDirs[p.name]}/>
        ))}
      </div>

      {/* Error from API */}
      {status==='error'&&errorMsg&&(
        <div className="mb-4 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700">
          <span className="font-semibold">Server error: </span>{errorMsg}
        </div>
      )}

      {/* Run button */}
      <button onClick={startRun} disabled={!canRun||status==='starting'}
        className="bg-emerald-600 hover:bg-emerald-700 text-white px-10 py-3.5 rounded-xl font-semibold text-base transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        {status==='starting'?<><span className="spin">⟳</span>&nbsp;Starting…</>:'▶  Run Pipeline'}
      </button>
      <p className="text-xs text-slate-400 mt-2">
        The pipeline will run in your terminal. You can close this tab once started.
      </p>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App(){
  const [step,setStep]=useState(1);
  const [patients,setPatients]=useState([]);
  const [patientShapes,setPatientShapes]=useState({});
  const [projectName,setProjectName]=useState('');
  const [projectDirs,setProjectDirs]=useState({});
  const [patientConfigs,setPatientConfigs]=useState({});
  const [mode,setMode]=useState('PRODUCTION');
  const [flags,setFlags]=useState({spect:true,dosimetry:true,postprocess:true,synthetic_lesions:false,logging_on:true});

  return(
    <div className="min-h-screen bg-slate-50">
      <StepBar step={step}/>
      <div className="pb-16">
        {step===1&&<Page1Welcome onNext={()=>setStep(2)}/>}
        {step===2&&<Page2CTInput patients={patients} setPatients={setPatients}
          patientShapes={patientShapes} setPatientShapes={setPatientShapes}
          onNext={()=>setStep(3)} onBack={()=>setStep(1)}/>}
        {step===3&&<Page3Configure patients={patients}
          projectName={projectName} setProjectName={setProjectName}
          projectDirs={projectDirs} setProjectDirs={setProjectDirs}
          patientConfigs={patientConfigs} setPatientConfigs={setPatientConfigs}
          flags={flags} setFlags={setFlags} mode={mode} setMode={setMode}
          patientShapes={patientShapes}
          onNext={()=>setStep(4)} onBack={()=>setStep(2)}/>}
        {step===4&&<Page4Run patients={patients} projectName={projectName}
          projectDirs={projectDirs} flags={flags} mode={mode}
          patientConfigs={patientConfigs}
          onBack={()=>setStep(3)}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
