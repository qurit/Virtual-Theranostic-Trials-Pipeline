  if(typeof value==='boolean') return<><LabelRow><input type="checkbox" checked={value} onChange={e=>call(e.target.checked)} className="w-4 h-4 accent-blue-600 flex-shrink-0"/></LabelRow><DescLine/></>;
  if(typeof value==='number'&&opts&&Array.isArray(opts)) return(
    <><LabelRow>
      <select value={value} onChange={e=>call(parseFloat(e.target.value))}
        className="px-2 py-1 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
        {opts.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
    </LabelRow><DescLine/></>
  );
  if(typeof value==='number') return(
    <><LabelRow>
      <div className="flex flex-col items-end gap-0.5">
        <input type="number" defaultValue={value}
          onChange={e=>{setNumErr(e.target.value!==''&&isNaN(parseFloat(e.target.value))?'Must be a number':'');}}
          onBlur={e=>{const v=e.target.value;if(v===''||isNaN(parseFloat(v))){setNumErr('Must be a number');}else{setNumErr('');call(parseFloat(v));}}}
          className={`w-32 px-2 py-1 text-sm border rounded-lg text-right focus:outline-none focus:ring-2 ${numErr?'border-red-400 focus:ring-red-300 bg-red-50':'border-slate-300 focus:ring-blue-400'}`}/>
        {numErr&&<span className="text-xs text-red-500">{numErr}</span>}
      </div>
    </LabelRow><DescLine/></>
  );
  if(value===null) return<><LabelRow><NullField call={call}/></LabelRow><DescLine/></>;
  if(typeof value==='string'){
    if(opts&&Array.isArray(opts)) return(
      <><LabelRow>
        <select value={value} onChange={e=>call(e.target.value)}
          className="px-2 py-1 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
          {opts.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </LabelRow><DescLine/></>
    );
    return<><LabelRow><input type="text" defaultValue={value} onBlur={e=>call(e.target.value)} className="w-44 px-2 py-1 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"/></LabelRow><DescLine/></>;
  }
  if(Array.isArray(value)){
    if(fieldKey==='roi_subset'&&roiChoices&&roiChoices.length>0){
      const choices=roiChoices.filter(r=>r!=='remaining_body');
      // ROIs with synthetic lesion specs (from phase 1 config)
      const roisWithLesions=lesionSpecs&&typeof lesionSpecs==='object'?new Set(Object.keys(lesionSpecs)):new Set();
      // Selected ROIs that also have lesions (for the info banner)
      const selectedWithLesions=value.filter(r=>roisWithLesions.has(r));
      return(
        <div className="py-2 border-b border-slate-100 last:border-0">
          <div className="flex items-center gap-1.5 mb-2">
            <span className="text-sm font-medium text-slate-700">{fieldKey}</span>
            {desc&&<button onClick={()=>setShowDesc(s=>!s)} className="text-slate-300 hover:text-blue-400 text-[10px] w-3.5 h-3.5 rounded-full border border-current flex items-center justify-center leading-none">?</button>}
          </div>
          <DescLine/>
          {choices.length===0&&<p className="text-xs text-slate-400 italic">No ROIs available — constrained by Phase 1 selection</p>}
          <div className="flex flex-wrap gap-1.5">
            {choices.map(roi=>{
              const hasLesion=roisWithLesions.has(roi);
              return(
                <label key={roi} className={`px-2 py-0.5 rounded-full text-xs cursor-pointer border select-none transition-colors flex items-center gap-1
                  ${value.includes(roi)?'bg-blue-100 border-blue-400 text-blue-700':'bg-slate-100 border-slate-300 text-slate-500 hover:border-slate-400'}`}>
                  <input type="checkbox" checked={value.includes(roi)}
                    onChange={e=>call(e.target.checked?[...value,roi]:value.filter(r=>r!==roi))} className="hidden"/>
                  {roi}
                  {hasLesion&&<span title="This ROI has synthetic lesions" className="text-[9px] bg-purple-200 text-purple-700 rounded px-1 font-bold leading-tight">lesion</span>}
                </label>
              );
            })}
          </div>
          {selectedWithLesions.length>0&&(
            <p className="text-[11px] text-purple-700 bg-purple-50 rounded px-2 py-1 mt-1.5">
              ⚠ Synthetic lesions auto-included for: {selectedWithLesions.join(', ')}
            </p>
          )}
        </div>
      );
    }
    return(
      <><LabelRow>
        <textarea key={JSON.stringify(value)} defaultValue={value.join(', ')}
          onBlur={e=>{const parts=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);call(parts.map(p=>{const n=Number(p);return isNaN(n)?p:n;}));}}
          rows={2} className="w-56 px-2 py-1 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"/>
      </LabelRow><DescLine/></>
    );
  }
  return null;
}

// ─── StageSection ─────────────────────────────────────────────────────────────
function StageSection({stageKey,stageData,basePath,patientName,onChange,descriptions,pipelineOptions,roiChoices,patientShape,systemCpuCount,lesionSpecs}){
  const [open,setOpen]=useState(false);
  const isSpectPost=stageKey==='spect_postprocess_stage';
  const isSynLesion=stageKey==='synthetic_lesions_stage';
  const entries=Object.entries(stageData).filter(([k])=>
    !DEVELOPER_FIELDS.has(k)&&
    !(isSpectPost&&(k==='FrameStartTimes'||k==='FrameDurations'))&&
    !(isSynLesion&&k==='specs')
  );
  return(
    <div className="border border-slate-100 rounded-lg overflow-hidden">
      <button onClick={()=>setOpen(o=>!o)}
        className="w-full flex items-center justify-between px-4 py-2.5 hover:bg-slate-50 transition-colors text-left">
        <span className="text-sm font-medium text-slate-600">{STAGE_LABELS[stageKey]||stageKey}</span>
        <span className="text-slate-300 text-xs">{open?'▲':'▼'}</span>
      </button>
      {open&&(
        <div className="px-4 pb-3">
          {entries.map(([k,v])=>{
            const fPath=[...basePath,k];
            if(typeof v==='object'&&v!==null&&!Array.isArray(v)){
              const sub=Object.entries(v).filter(([sk])=>!DEVELOPER_FIELDS.has(sk));
              if(!sub.length)return null;
              return(
                <div key={k} className="mt-3">
                  <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">{STAGE_LABELS[k]||k}</p>
                  <div className="pl-3 border-l-2 border-slate-100">
                    {sub.map(([sk,sv])=>(
                      <FieldRenderer key={sk} fieldKey={sk} value={sv} path={[...fPath,sk]}
                        patientName={patientName} onChange={onChange} descriptions={descriptions}
                        pipelineOptions={pipelineOptions} roiChoices={roiChoices} patientShape={patientShape}
                        systemCpuCount={systemCpuCount} lesionSpecs={lesionSpecs}/>
                    ))}
                  </div>
                </div>
              );
            }
            return<FieldRenderer key={k} fieldKey={k} value={v} path={fPath}
              patientName={patientName} onChange={onChange} descriptions={descriptions}
              pipelineOptions={pipelineOptions} roiChoices={roiChoices} patientShape={patientShape}
              systemCpuCount={systemCpuCount} lesionSpecs={lesionSpecs}/>;
          })}
          {isSynLesion&&'specs' in stageData&&(
            <SpecsEditor value={stageData.specs}
              onChange={v=>onChange(patientName,[...basePath,'specs'],v)}
              roiChoices={roiChoices} desc={descriptions['specs']||''}/>
          )}
          {isSpectPost&&'FrameStartTimes' in stageData&&'FrameDurations' in stageData&&(
            <FrameTimesSection frameStartTimes={stageData.FrameStartTimes}
              frameDurations={stageData.FrameDurations}
              basePath={basePath} patientName={patientName} onChange={onChange}/>
          )}
        </div>
      )}
    </div>
  );
}

// ─── PhaseSection ─────────────────────────────────────────────────────────────
function PhaseSection({phaseKey,phaseData,patientName,onChange,descriptions,pipelineOptions,roiChoices,phase1RoiSubset,patientShape,flags,systemCpuCount,lesionSpecs}){
  const [open,setOpen]=useState(false);
  const stages=Object.entries(phaseData).filter(([k,v])=>{
    if(k==='sub_dir_name'||typeof v!=='object'||v===null) return false;
    // Hide stages whose controlling flag is OFF
    const flagKey=STAGE_FLAG_MAP[k];
    if(flagKey&&!flags?.[flagKey]) return false;
    // dosemap_postprocess_stage additionally requires dosimetry to be on
    if(k==='dosemap_postprocess_stage'&&!flags?.dosimetry) return false;
    return true;
  });
  // Constrain to phase_1 selection for all non-segmentation stages
  const constrained=(Array.isArray(phase1RoiSubset)&&phase1RoiSubset.length>0)
    ?roiChoices.filter(r=>phase1RoiSubset.includes(r))
    :roiChoices;
  return(
    <div className="border border-slate-200 rounded-xl overflow-hidden">
      <button onClick={()=>setOpen(o=>!o)}
        className="w-full flex items-center justify-between px-4 py-3 bg-slate-50 hover:bg-slate-100 transition-colors text-left">
        <span className="text-sm font-semibold text-slate-700">{PHASE_LABELS[phaseKey]||phaseKey}</span>
        <span className="text-slate-400 text-xs">{open?'▲':'▼'}</span>
      </button>
      {open&&(
        <div className="p-3 space-y-2">
          {stages.map(([sk,sd])=>(
            <StageSection key={sk} stageKey={sk} stageData={sd}
              basePath={[phaseKey,sk]} patientName={patientName} onChange={onChange}
              descriptions={descriptions} pipelineOptions={pipelineOptions}
              // segmentation_stage sees full choices; everything else is constrained
              roiChoices={sk==='segmentation_stage'?roiChoices:constrained}
              patientShape={patientShape} systemCpuCount={systemCpuCount}
              lesionSpecs={lesionSpecs}/>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Page 3 ───────────────────────────────────────────────────────────────────
function Page3Configure({patients,projectName,setProjectName,projectDirs,setProjectDirs,
                         patientConfigs,setPatientConfigs,flags,setFlags,mode,setMode,
                         patientShapes,systemCpuCount,onNext,onBack}){
  const [dirsCreated,setDirsCreated]=useState(Object.keys(projectDirs).length>0);
  const [creating,setCreating]=useState(false);
  const [createError,setCreateError]=useState('');
  const [configMeta,setConfigMeta]=useState(null);
  const [applyToAll,setApplyToAll]=useState(false);
  const [openCards,setOpenCards]=useState({});
  const [existedDirs,setExistedDirs]=useState({});        // {patient_name: bool}
  const [completionStatus,setCompletionStatus]=useState({}); // {patient_name: {phase1_segmentation:bool,...}}
  const [phaseWarnings,setPhaseWarnings]=useState({});    // {patient_name: Set<string>}
  const saveTimers=useRef({});

  useEffect(()=>{
    apiFetch('/api/config-template').then(r=>r.json()).then(d=>{
      setConfigMeta(d);
      if(Object.keys(patientConfigs).length===0&&d.template){
        const init={};patients.forEach(p=>{init[p.name]=JSON.parse(JSON.stringify(d.template));});
        setPatientConfigs(init);
      }
    }).catch(console.error);
  },[]);

  const createDirs=async()=>{
    if(!projectName.trim()){setCreateError('Enter a project name first.');return;}
    setCreating(true);setCreateError('');
    try{
      const res=await apiFetch('/api/create-output-dirs',{method:'POST',body:JSON.stringify({project_name:projectName.trim(),patients})});
      if(!res.ok){const err=await res.json();setCreateError(err.detail||'Failed');setCreating(false);return;}
      const data=await res.json();
      setProjectDirs(data.dirs);setDirsCreated(true);
      const existed=data.existed||{};
      setExistedDirs(existed);
      // Auto-fill config from existing run for patients with prior outputs
      const existingCfgs=data.existing_configs||{};
      setPatientConfigs(prev=>{
        const u={...prev};
        patients.forEach(p=>{
          const nm=p.name;
          if(existed[nm]&&existingCfgs[nm]){
            // Use the saved config from the previous run; keep output_folder_title in sync
            u[nm]={...existingCfgs[nm],output_folder_title:projectName.trim()};
          } else {
            u[nm]={...(u[nm]||{}),output_folder_title:projectName.trim()};
          }
        });
        return u;
      });
      // Fetch per-patient completion status for existed patients
      const statusMap={};
      await Promise.all(patients.filter(p=>existed[p.name]).map(async p=>{
        const dir=data.dirs[p.name];
        if(!dir) return;
        try{
          const sr=await apiFetch(`/api/check-completion?output_dir=${encodeURIComponent(dir)}`);
          if(sr.ok) statusMap[p.name]=await sr.json();
        }catch(_){}
      }));
      setCompletionStatus(statusMap);
    }catch(e){setCreateError('Error: '+e.message);}
    setCreating(false);
  };

  // Map a config path array to the completion-status key it affects.
  const _pathToCompletionKey=(path)=>{
    if(!path||path.length<2) return null;
    const [ph,st]=path;
    if(ph==='phase_1'){
      if(st==='segmentation_stage') return 'phase1_segmentation';
      if(st==='synthetic_lesions_stage') return 'phase1_synthetic_lesions';
      if(st==='pbpk_tac_stage') return 'phase1_pbpk';
    }
    if(ph==='phase_2'){
      if(st==='simind_stage') return 'phase2_simind';
      if(st==='opengate_stage') return 'phase2_opengate';
    }
    if(ph==='phase_3'){
      if(st==='spect_postprocess_stage') return 'phase3_spect';
      if(st==='dosemap_postprocess_stage') return 'phase3_dosemap';
    }
    return null;
  };

  const handleConfigChange=useCallback((patientName,path,value)=>{
    setPatientConfigs(prev=>{
      const tmpl=configMeta?.template||{};
      const updated={...prev};
      updated[patientName]=deepSet(updated[patientName]||tmpl,path,value);
      // Warn if the changed field belongs to a phase that already has output on disk
      const cKey=_pathToCompletionKey(path);
      if(cKey&&completionStatus[patientName]?.[cKey]){
        setPhaseWarnings(w=>{const nw={...w};const s=new Set(nw[patientName]||[]);s.add(cKey);nw[patientName]=s;return nw;});
      }
      const isP1Roi=path[0]==='phase_1'&&path[path.length-1]==='roi_subset';
      if(isP1Roi){
        const p1Set=new Set(value);
        const trimRoi=(cfg,ph,st)=>{const cur=cfg?.[ph]?.[st]?.roi_subset;return Array.isArray(cur)?deepSet(cfg,[ph,st,'roi_subset'],cur.filter(r=>p1Set.has(r))):cfg;};
        updated[patientName]=trimRoi(updated[patientName],'phase_2','simind_stage');
        updated[patientName]=trimRoi(updated[patientName],'phase_2','opengate_stage');
        // Also trim specs keys that are no longer in roi_subset
        const specs=updated[patientName]?.phase_1?.synthetic_lesions_stage?.specs;
        if(specs&&typeof specs==='object'){
          const newSpecs={};Object.keys(specs).forEach(k=>{if(p1Set.has(k))newSpecs[k]=specs[k];});
          updated[patientName]=deepSet(updated[patientName],['phase_1','synthetic_lesions_stage','specs'],Object.keys(newSpecs).length?newSpecs:null);
        }
      }
      const toSync=applyToAll?patients.filter(p=>p.name!==patientName):[];
      toSync.forEach(p=>{
        updated[p.name]=deepSet(updated[p.name]||tmpl,path,value);
        if(isP1Roi){
          const p1Set=new Set(value);
          const trimRoi=(cfg,ph,st)=>{const cur=cfg?.[ph]?.[st]?.roi_subset;return Array.isArray(cur)?deepSet(cfg,[ph,st,'roi_subset'],cur.filter(r=>p1Set.has(r))):cfg;};
          updated[p.name]=trimRoi(updated[p.name],'phase_2','simind_stage');
          updated[p.name]=trimRoi(updated[p.name],'phase_2','opengate_stage');
          const specs=updated[p.name]?.phase_1?.synthetic_lesions_stage?.specs;
          if(specs&&typeof specs==='object'){
            const ns={};Object.keys(specs).forEach(k=>{if(p1Set.has(k))ns[k]=specs[k];});
            updated[p.name]=deepSet(updated[p.name],['phase_1','synthetic_lesions_stage','specs'],Object.keys(ns).length?ns:null);
          }
        }
      });
      const saveOne=async(nm)=>{const dir=projectDirs[nm];if(!dir)return;try{await apiFetch('/api/save-patient-config',{method:'POST',body:JSON.stringify({output_dir:dir,config:updated[nm]})});}catch(e){console.error('Auto-save failed:',e);}};
      clearTimeout(saveTimers.current[patientName]);
      saveTimers.current[patientName]=setTimeout(()=>{saveOne(patientName);toSync.forEach(p=>saveOne(p.name));},500);
      return updated;
    });
  },[patients,projectDirs,applyToAll,configMeta,completionStatus]);

  const handleFlagChange=(key,checked)=>{
    setFlags(prev=>({...prev,[key]:checked}));
    if(!checked){
      // Clear stage-specific data when the controlling flag is turned OFF
      setPatientConfigs(prev=>{
        const updated={...prev};
        Object.keys(updated).forEach(nm=>{
          if(key==='synthetic_lesions'&&updated[nm]?.phase_1?.synthetic_lesions_stage)
            updated[nm]=deepSet(updated[nm],['phase_1','synthetic_lesions_stage','specs'],null);
          if(key==='spect'&&updated[nm]?.phase_2?.simind_stage)
            updated[nm]=deepSet(updated[nm],['phase_2','simind_stage','roi_subset'],[]);
          if(key==='dosimetry'&&updated[nm]?.phase_2?.opengate_stage)
            updated[nm]=deepSet(updated[nm],['phase_2','opengate_stage','roi_subset'],[]);
        });
        return updated;
      });
    }
  };

  const roiChoices=(configMeta?.roi_choices||[]).filter(r=>r!=='remaining_body');

  return(
    <div className="max-w-4xl mx-auto px-6 py-8">
      <div className="flex items-center gap-3 mb-6">
        <button onClick={onBack} className="text-slate-400 hover:text-slate-600 text-sm flex items-center gap-1">← Back</button>
        <h2 className="text-2xl font-bold text-slate-900">Configure Pipeline</h2>
      </div>

      {/* Project name */}
      <div className="bg-white border border-slate-200 rounded-2xl p-6 mb-5 shadow-sm">
        <h3 className="font-semibold text-slate-800 mb-1">Project Name</h3>
        <p className="text-xs text-slate-500 mb-4">Creates <code className="bg-slate-100 px-1 rounded">{'{name}'}_CT_1</code>, … directories in the repo root.</p>
        <div className="flex gap-3 items-start">
          <input type="text" value={projectName} onChange={e=>setProjectName(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!dirsCreated)createDirs();}} placeholder="e.g. my_study" disabled={dirsCreated}
            className="flex-1 px-3 py-2 border border-slate-300 rounded-xl terminal-font text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:text-slate-400"/>
          {!dirsCreated
            ?<button onClick={createDirs} disabled={creating||!projectName.trim()}
                className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl font-semibold text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm whitespace-nowrap">
                {creating?<><span className="spin">⟳</span>&nbsp;Creating…</>:'Create Output Dirs'}
              </button>
            :<span className="flex items-center gap-1.5 text-emerald-600 font-semibold text-sm px-3 py-2 whitespace-nowrap">✓ Created</span>
          }
        </div>
        {createError&&<p className="mt-2 text-sm text-red-600">{createError}</p>}
        {dirsCreated&&<div className="mt-3 space-y-0.5">{patients.map((p,i)=><p key={p.name} className="text-xs terminal-font text-slate-400">✓ {projectDirs[p.name]||`${projectName}_CT_${i+1}`}</p>)}</div>}
      </div>

      {/* Pipeline Options */}
      <div className="bg-white border border-slate-200 rounded-2xl p-6 mb-5 shadow-sm">
        <h3 className="font-semibold text-slate-800 mb-1">Pipeline Options</h3>
        <p className="text-xs text-slate-500 mb-4">Select which stages to run.</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-5">
          {CLI_FLAGS.map(({key,label,desc})=>(
            <label key={key} className={`flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition-colors select-none
              ${flags[key]?'border-blue-400 bg-blue-50':'border-slate-200 hover:border-slate-300 bg-white'}`}>
              <input type="checkbox" checked={!!flags[key]} onChange={e=>handleFlagChange(key,e.target.checked)}
                className="mt-0.5 w-4 h-4 accent-blue-600 flex-shrink-0"/>
              <div><p className="font-semibold text-slate-800 text-sm">{label}</p>
                <p className="text-xs text-slate-500 mt-0.5 leading-snug">{desc}</p></div>
            </label>
          ))}
        </div>
        <div className="border-t border-slate-100 pt-4 flex items-center gap-4 flex-wrap">
          <span className="text-sm font-semibold text-slate-700 flex-shrink-0">Run Mode</span>
          <div className="flex gap-2">
            {['PRODUCTION','DEBUG'].map(m=>(
              <button key={m} onClick={()=>setMode(m)}
                className={`px-5 py-1.5 rounded-lg text-sm font-semibold border transition-colors
                  ${mode===m?(m==='PRODUCTION'?'bg-emerald-600 text-white border-emerald-600':'bg-amber-500 text-white border-amber-500'):'bg-white text-slate-600 border-slate-300 hover:border-slate-400'}`}>
                {m}
              </button>
            ))}
          </div>
          <span className="text-xs text-slate-400">{mode==='DEBUG'?'Reduced iterations — faster testing':'Full production-quality simulation'}</span>
        </div>
      </div>

      {/* Per-patient config */}
      {dirsCreated&&configMeta&&(
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
          <div className="flex items-center justify-between mb-1">
            <h3 className="font-semibold text-slate-800">Per-Patient Configuration</h3>
            <label className="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" checked={applyToAll} onChange={e=>setApplyToAll(e.target.checked)} className="w-4 h-4 accent-blue-600"/>
              <span className="text-slate-600 text-sm">Sync all patients</span>
            </label>
          </div>
          <p className="text-xs text-slate-400 mb-4">Changes auto-save to each config.json. Phase 2 ROI pickers and lesion specs are constrained to Phase 1 selection.</p>
          {Object.values(existedDirs).some(Boolean)&&(
            <div className="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2.5 mb-4 text-xs text-amber-800">
              <span className="flex-shrink-0 mt-0.5">⚠</span>
              <span>Prior pipeline outputs detected for one or more patients. Completed stages will be skipped automatically; only stages without existing outputs will re-run.</span>
            </div>
          )}
          <div className="space-y-2">
            {patients.map((p,i)=>{
              const cfg=patientConfigs[p.name]||configMeta.template;
              const cardOpen=!!openCards[p.name];
              const shape=patientShapes[p.name]||null;
              // Phase 1 segmentation roi_subset is the source of truth for all ROI constraints
              const p1RoiSubset=cfg?.phase_1?.segmentation_stage?.roi_subset??null;
              const hasPrior=!!existedDirs[p.name];
              return(
                <div key={p.name} className="border border-slate-200 rounded-xl overflow-hidden">
                  <button onClick={()=>setOpenCards(prev=>({...prev,[p.name]:!prev[p.name]}))}
                    className="w-full flex items-center justify-between px-4 py-3 bg-slate-50 hover:bg-slate-100 transition-colors text-left">
                    <div className="flex items-center gap-2">
                      <span className="font-semibold text-slate-700 text-sm">CT_{i+1} — {p.name}</span>
                      {hasPrior&&<span className="text-[10px] font-semibold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">prior outputs</span>}
                    </div>
                    <span className="text-slate-400 text-xs">{cardOpen?'▲':'▼'}</span>
                  </button>
                  {cardOpen&&(
                    <div className="p-4 space-y-3">
                      {/* Auto-fill banner */}
                      {hasPrior&&existedDirs[p.name]&&Object.keys(completionStatus[p.name]||{}).some(k=>completionStatus[p.name][k])&&(
                        <div className="flex items-start gap-2 bg-blue-50 border border-blue-200 rounded-xl px-3 py-2 text-xs text-blue-800">
                          <span className="flex-shrink-0 mt-0.5">ℹ</span>
                          <span>Config auto-filled from previous run. Completed stages will be skipped; only stages without existing outputs will re-run.</span>
                        </div>
                      )}
                      {/* Config-change warnings for completed phases */}
                      {phaseWarnings[p.name]&&phaseWarnings[p.name].size>0&&(
                        <div className="flex items-start gap-2 bg-orange-50 border border-orange-300 rounded-xl px-3 py-2 text-xs text-orange-900">
                          <span className="flex-shrink-0 mt-0.5">⚠</span>
                          <div className="flex-1">
                            <span className="font-semibold">Changed params for already-completed stages: </span>
                            <span>{[...phaseWarnings[p.name]].join(', ')}</span>
                            <span>. Those stages will be skipped on rerun. Delete the relevant output folders to force them to re-execute.</span>
                          </div>
                          <button className="flex-shrink-0 text-orange-500 hover:text-orange-700 font-bold leading-none"
                            onClick={()=>setPhaseWarnings(w=>{const nw={...w};delete nw[p.name];return nw;})}>✕</button>
                        </div>
                      )}
                      {['phase_1','phase_2','phase_3'].map(pk=>cfg[pk]?(
                        <PhaseSection key={pk} phaseKey={pk} phaseData={cfg[pk]}
                          patientName={p.name} onChange={handleConfigChange}
                          descriptions={configMeta.field_descriptions||{}}
                          pipelineOptions={configMeta.pipeline_options||{}}
                          roiChoices={roiChoices}
                          phase1RoiSubset={p1RoiSubset}
                          patientShape={shape}
                          flags={flags}
                          systemCpuCount={systemCpuCount}
                          lesionSpecs={cfg?.phase_1?.synthetic_lesions_stage?.specs||null}/>
                      ):null)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="mt-6 flex justify-end">
        <button onClick={onNext} disabled={!dirsCreated}
          className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold text-base transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-sm">
          Continue to Run →
        </button>
      </div>
    </div>
  );
}

// ─── Config Summary Card (per patient) ───────────────────────────────────────
function ConfigSummaryCard({patient,cfg,flags,projectDir}){
  const ph1=cfg?.phase_1;const ph2=cfg?.phase_2;const ph3=cfg?.phase_3;
  const tac=ph1?.pbpk_tac_stage;
  const synth=ph1?.synthetic_lesions_stage;
  const simind=ph2?.simind_stage;
  const og=ph2?.opengate_stage;
  const pp=ph3?.spect_postprocess_stage;

  const kv=(label,val)=>{
    if(val===undefined||val===null)return null;
    const display=Array.isArray(val)?(val.length?val.join(', '):'—'):String(val);
    return(
      <div className="flex gap-2 text-xs py-0.5">
        <span className="text-slate-400 w-36 shrink-0">{label}</span>
        <span className="text-slate-700 font-medium break-all">{display}</span>
      </div>
    );
  };

  const Section=({title,children})=>(
    <div className="mb-3">
      <p className="text-[10px] uppercase tracking-widest text-slate-400 font-semibold mb-1">{title}</p>
      <div className="bg-slate-50 rounded-xl px-3 py-2 space-y-0.5">{children}</div>
    </div>
  );

  const Badge=({label,color})=>{
    const c={blue:'bg-blue-100 text-blue-700',purple:'bg-purple-100 text-purple-700',
              teal:'bg-teal-100 text-teal-700',orange:'bg-orange-100 text-orange-700'}[color]||'bg-slate-100 text-slate-600';
    return <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${c}`}>{label}</span>;
  };

  return(
    <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
      <div className="flex items-start justify-between gap-3 mb-3">
        <span className="font-semibold text-slate-800 text-base">{patient.name}</span>
        {projectDir&&<span className="text-[10px] terminal-font text-slate-400 truncate max-w-xs">{projectDir}</span>}
      </div>
      <div className="flex flex-wrap gap-1.5 mb-4">
        {flags.spect&&<Badge label="SPECT Simulation" color="blue"/>}
        {flags.dosimetry&&<Badge label="Dosimetry" color="purple"/>}
        {flags.postprocess&&<Badge label="Post-Processing" color="teal"/>}
        {flags.synthetic_lesions&&<Badge label="Synthetic Lesions" color="orange"/>}
      </div>

      {tac&&(
        <Section title="PBPK TAC (Phase 1)">
          {kv('Model type', tac.ModelType||tac.model_type)}
          {kv('Isotope', tac.Isotope||tac.isotope)}
          {kv('ROI subset', tac.roi_subset)}
        </Section>
      )}
      {flags.synthetic_lesions&&synth&&(
        <Section title="Synthetic Lesions (Phase 1)">
          {kv('Organ specs', synth.specs?Object.keys(synth.specs).join(', '):'—')}
        </Section>
      )}
      {flags.spect&&simind&&(
        <Section title="SIMIND Simulation (Phase 2)">
          {kv('Collimator', simind.Collimator||simind.collimator)}
          {kv('Projections', simind.NumProjections||simind.num_projections)}
          {kv('ROI subset', simind.roi_subset)}
        </Section>
      )}
      {flags.dosimetry&&og&&(
        <Section title="OpenGATE Dosimetry (Phase 2)">
          {kv('ROI subset', og.roi_subset)}
        </Section>
      )}
      {flags.postprocess&&pp&&(
        <Section title="Post-Processing (Phase 3)">
          {kv('Algorithm', pp.ReconstructionAlgorithm||pp.reconstruction_algorithm)}
          {kv('Subsets', pp.Subsets||pp.num_subsets)}
          {kv('Iterations', pp.Iterations||pp.num_iterations)}
          {kv('Apply TAC', pp.apply_tac?'Yes':'No')}
          {kv('Apply Noise', pp.apply_poisson_noise?'Yes':'No')}
          {kv('Apply Reconstruction', pp.apply_reconstruction?'Yes':'No')}
        </Section>
      )}
    </div>
  );
}

// ─── Page 4 ───────────────────────────────────────────────────────────────────
function Page4Run({patients,projectName,projectDirs,flags,mode,patientConfigs,onBack}){
  const [status,setStatus]=useState('idle'); // idle | starting | launched | error
  const [errorMsg,setErrorMsg]=useState('');
  const [validation,setValidation]=useState(null);

  // Pre-run validation
  useEffect(()=>{
    const issues=[];
    if(!projectName.trim()) issues.push('Project name is empty');
    if(!patients.length)    issues.push('No patients selected');
    patients.forEach(p=>{
      if(!projectDirs[p.name]) issues.push(`Missing output directory for "${p.name}"`);
      const cfg=patientConfigs?.[p.name];
      if(!cfg) return;
      // FrameStartTimes / FrameDurations
      const fst=cfg?.phase_3?.spect_postprocess_stage?.FrameStartTimes;
      const fd =cfg?.phase_3?.spect_postprocess_stage?.FrameDurations;
      if(Array.isArray(fst)&&Array.isArray(fd)){
        if(fst.length!==fd.length) issues.push(`[${p.name}] FrameStartTimes (${fst.length}) ≠ FrameDurations (${fd.length})`);
        fst.forEach((v,i)=>{if(typeof v!=='number'||isNaN(v)) issues.push(`[${p.name}] FrameStartTimes[${i}] must be a number`);});
        fd.forEach((v,i)=>{ if(typeof v!=='number'||isNaN(v)) issues.push(`[${p.name}] FrameDurations[${i}] must be a number`);});
      }
      // Synthetic lesions: at least 1 spec required
      if(flags.synthetic_lesions){
        const specs=cfg?.phase_1?.synthetic_lesions_stage?.specs;
        if(!specs||typeof specs!=='object'||Object.keys(specs).length===0)
          issues.push(`[${p.name}] Synthetic Lesions is ON but no organ specs are configured — add at least one spec in Phase 1`);
      }
      // SPECT: simind must have at least one ROI selected
      if(flags.spect){
        const roi=cfg?.phase_2?.simind_stage?.roi_subset;
        if(!Array.isArray(roi)||roi.length===0)
          issues.push(`[${p.name}] SPECT is ON but no ROIs are selected in the SIMIND stage`);
      }
      // Post-processing + SPECT: at least one option enabled
      if(flags.postprocess&&flags.spect){
        const pp=cfg?.phase_3?.spect_postprocess_stage;
        if(pp&&!pp.apply_tac&&!pp.apply_poisson_noise&&!pp.apply_reconstruction)
          issues.push(`[${p.name}] Post-Processing + SPECT: enable at least one of Apply TAC, Apply Noise, or Apply Reconstruction`);
      }
      // Dosimetry: at least one ROI in opengate
      if(flags.dosimetry){
        const roi=cfg?.phase_2?.opengate_stage?.roi_subset;
        if(!Array.isArray(roi)||roi.length===0)
          issues.push(`[${p.name}] Dosimetry is ON but no ROIs are selected in the OpenGATE stage`);
      }
    });
    setValidation({ok:!issues.length,issues});
  },[patientConfigs,flags,patients,projectName,projectDirs]);

  const startRun=async()=>{
    setStatus('starting');setErrorMsg('');
    try{
      const res=await apiFetch('/api/run',{method:'POST',body:JSON.stringify({project_name:projectName,patients,project_dirs:projectDirs,flags,mode})});
      if(!res.ok){const err=await res.json();setErrorMsg(err.detail||'Unknown server error');setStatus('error');return;}
      setStatus('launched');
    }catch(e){setErrorMsg(e.message);setStatus('error');}
  };

  const canRun=validation?.ok&&status==='idle';

  // ── Launched screen ────────────────────────────────────────────────────────
  if(status==='launched'){
    return(
      <div className="max-w-lg mx-auto px-6 py-24 text-center">
        <h2 className="text-2xl font-bold text-slate-900 mb-3">Pipeline Started</h2>
        <p className="text-slate-500 mb-8 leading-relaxed">
          The pipeline is now running in the terminal where you launched{' '}
          <code className="bg-slate-100 px-1.5 py-0.5 rounded text-sm font-mono">python run_server.py</code>.
          Monitor progress there.
        </p>
        <div className="bg-slate-100 border border-slate-200 rounded-2xl px-6 py-5 mb-8 text-left">
          <p className="text-slate-700 font-semibold mb-2 text-sm">Output directories</p>
          {patients.map(p=>(
            <div key={p.name} className="text-xs terminal-font text-slate-500 break-all mb-1">
              <span className="font-semibold text-slate-600">{p.name}:</span> {projectDirs[p.name]||'—'}
            </div>
          ))}
        </div>
        <p className="text-slate-500 text-sm">You can close this tab — the pipeline will continue running.</p>
      </div>
    );
  }

  // ── Main review + run screen ───────────────────────────────────────────────
  return(
    <div className="max-w-4xl mx-auto px-6 py-8">
      <div className="flex items-center gap-3 mb-6">
        <button onClick={onBack}
          className="text-slate-400 hover:text-slate-600 text-sm flex items-center gap-1">
          ← Back
        </button>
        <h2 className="text-2xl font-bold text-slate-900">Review & Run</h2>
      </div>

      {/* Validation panel */}
      {validation&&(
        <div className={`rounded-2xl p-4 mb-6 border ${validation.ok?'bg-emerald-50 border-emerald-200':'bg-red-50 border-red-200'}`}>
          <p className={`font-semibold mb-2 ${validation.ok?'text-emerald-800':'text-red-700'}`}>
            {validation.ok?'✓ All checks passed — ready to run':'✗ Fix these issues before running'}
          </p>
          {validation.ok?(
            <div className="text-sm text-emerald-700 space-y-0.5">
              <p>· {patients.length} patient{patients.length!==1?'s':''} queued</p>
              <p>· Mode: <span className="font-semibold">{mode}</span></p>
              <p>· Logging: <span className="font-semibold">{flags.logging_on?'On':'Off'}</span></p>
            </div>
          ):(
            <ul className="space-y-1">{validation.issues.map((iss,i)=><li key={i} className="text-sm text-red-700">· {iss}</li>)}</ul>
          )}
        </div>
      )}

      {/* Per-patient config summary */}
      <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-3">Configuration Summary</h3>
      <div className="space-y-4 mb-8">
        {patients.map(p=>(
          <ConfigSummaryCard key={p.name} patient={p} cfg={patientConfigs?.[p.name]}
            flags={flags} projectDir={projectDirs[p.name]}/>
        ))}
      </div>

      {/* Error from API */}
      {status==='error'&&errorMsg&&(
        <div className="mb-4 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700">
          <span className="font-semibold">Server error: </span>{errorMsg}
        </div>
      )}

      {/* Run button */}
      <button onClick={startRun} disabled={!canRun||status==='starting'}
        className="bg-emerald-600 hover:bg-emerald-700 text-white px-10 py-3.5 rounded-xl font-semibold text-base transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        {status==='starting'?<><span className="spin">⟳</span>&nbsp;Starting…</>:'▶  Run Pipeline'}
      </button>
      <p className="text-xs text-slate-400 mt-2">
        The pipeline will run in your terminal. You can close this tab once started.
      </p>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App(){
  const [step,setStep]=useState(1);
  const [patients,setPatients]=useState([]);
  const [patientShapes,setPatientShapes]=useState({});
  const [projectName,setProjectName]=useState('');
  const [projectDirs,setProjectDirs]=useState({});
  const [patientConfigs,setPatientConfigs]=useState({});
  const [mode,setMode]=useState('PRODUCTION');
  const [flags,setFlags]=useState({spect:true,dosimetry:true,postprocess:true,synthetic_lesions:false,logging_on:true});
  const [systemCpuCount,setSystemCpuCount]=useState(null);

  useEffect(()=>{
    apiFetch('/api/system-info').then(r=>r.json()).then(d=>setSystemCpuCount(d.cpu_count||null)).catch(()=>{});
  },[]);

  return(
    <div className="min-h-screen bg-slate-50">
      <StepBar step={step}/>
      <div className="pb-16">
        {step===1&&<Page1Welcome onNext={()=>setStep(2)}/>}
        {step===2&&<Page2CTInput patients={patients} setPatients={setPatients}
          patientShapes={patientShapes} setPatientShapes={setPatientShapes}
          onNext={()=>setStep(3)} onBack={()=>setStep(1)}/>}
        {step===3&&<Page3Configure patients={patients}
          projectName={projectName} setProjectName={setProjectName}
          projectDirs={projectDirs} setProjectDirs={setProjectDirs}
          patientConfigs={patientConfigs} setPatientConfigs={setPatientConfigs}
          flags={flags} setFlags={setFlags} mode={mode} setMode={setMode}
          patientShapes={patientShapes} systemCpuCount={systemCpuCount}
          onNext={()=>setStep(4)} onBack={()=>setStep(2)}/>}
        {step===4&&<Page4Run patients={patients} projectName={projectName}
          projectDirs={projectDirs} flags={flags} mode={mode}
          patientConfigs={patientConfigs}
          onBack={()=>setStep(3)}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
