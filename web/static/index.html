      <div className="bg-white border border-slate-200 rounded-2xl p-6 mb-5 shadow-sm">
        <h3 className="font-semibold text-slate-800 mb-1">Project Name</h3>
        <p className="text-xs text-slate-500 mb-4">Creates <code className="bg-slate-100 px-1 rounded">{'{name}'}/CT_1</code>, … inside a project folder in the repo root.</p>
        <div className="flex gap-3 items-start">
          <input type="text" value={projectName} onChange={e=>setProjectName(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!dirsCreated)createDirs();}} placeholder="e.g. my_study" disabled={dirsCreated}
            className="flex-1 px-3 py-2 border border-slate-300 rounded-xl terminal-font text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:text-slate-400"/>
          {!dirsCreated
            ?<button onClick={createDirs} disabled={creating||!projectName.trim()}
                className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl font-semibold text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm whitespace-nowrap">
                {creating?<><span className="spin">⟳</span>&nbsp;Creating…</>:'Create Output Dirs'}
              </button>
            :<span className="flex items-center gap-1.5 text-emerald-600 font-semibold text-sm px-3 py-2 whitespace-nowrap">✓ Created</span>
          }
        </div>
        {createError&&<p className="mt-2 text-sm text-red-600">{createError}</p>}
        {dirsCreated&&<div className="mt-3 space-y-0.5">{patients.map((p,i)=><p key={p.name} className="text-xs terminal-font text-slate-400">✓ {projectDirs[p.name]||`${projectName}/CT_${i+1}`}</p>)}</div>}
      </div>

      {/* Per-patient config */}
      {dirsCreated&&configMeta&&(
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
          <h3 className="font-semibold text-slate-800 mb-1">Per-Patient Configuration</h3>
          <p className="text-xs text-slate-400 mb-4">
            Configure each patient independently. Stage flags (which stages to run) are set per patient below.
            For patients 2+, use <span className="font-semibold text-blue-600">Match PT-1</span> next to any stage to copy Patient 1's settings — the stage becomes read-only while matched.
          </p>
          {Object.values(existedDirs).some(Boolean)&&(
            <div className="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2.5 mb-4 text-xs text-amber-800">
              <span className="flex-shrink-0 mt-0.5">⚠</span>
              <span>Prior pipeline outputs detected for one or more patients. Existing outputs are only reusable when the CT and effective stage config still match the saved metadata.</span>
            </div>
          )}
          <div className="space-y-2">
            {patients.map((p,i)=>{
              const cfg=patientConfigs[p.name]||configMeta.template;
              const pFlags=patientFlags[p.name]||DEFAULT_FLAGS;
              const cardOpen=!!openCards[p.name];
              const shape=patientShapes[p.name]||null;
              const nativeSpacing=patientSpacings[p.name]||null;
              const p1RoiSubset=cfg?.phase_1?.segmentation_stage?.roi_subset??null;
              const hasPrior=!!existedDirs[p.name];
              const isFirst=i===0;
              const pSynced=syncedStages[p.name]||new Set();
              return(
                <div key={p.name} className="border border-slate-200 rounded-xl overflow-hidden">
                  <button onClick={()=>setOpenCards(prev=>({...prev,[p.name]:!prev[p.name]}))}
                    className="w-full flex items-center justify-between px-4 py-3 bg-slate-50 hover:bg-slate-100 transition-colors text-left">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-semibold text-slate-700 text-sm">CT_{i+1} — {p.name}</span>
                      {isFirst&&<span className="text-[9px] font-semibold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">Reference (Patient 1)</span>}
                      {hasPrior&&<span className="text-[9px] font-semibold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">prior outputs</span>}
                      {pSynced.size>0&&<span className="text-[9px] font-semibold bg-teal-100 text-teal-700 px-2 py-0.5 rounded-full">{pSynced.size} stage{pSynced.size!==1?'s':''} matched to PT-1</span>}
                    </div>
                    <span className="text-slate-400 text-xs">{cardOpen?'▲':'▼'}</span>
                  </button>
                  {cardOpen&&(
                    <div className="p-4 space-y-3">
                      {hasPrior&&Object.keys(completionStatus[p.name]||{}).some(k=>completionStatus[p.name][k])&&(
                        <div className="flex items-start gap-2 bg-blue-50 border border-blue-200 rounded-xl px-3 py-2 text-xs text-blue-800">
                          <span className="flex-shrink-0 mt-0.5">ℹ</span>
                          <span>Config auto-filled from the previous run. The Run page will compare settings and CT against saved metadata before allowing a rerun.</span>
                        </div>
                      )}
                      {phaseWarnings[p.name]&&phaseWarnings[p.name].size>0&&(
                        <div className="flex items-start gap-2 bg-orange-50 border border-orange-300 rounded-xl px-3 py-2 text-xs text-orange-900">
                          <span className="flex-shrink-0 mt-0.5">⚠</span>
                          <div className="flex-1">
                            <span className="font-semibold">Changed params for already-completed stages: </span>
                            <span>{[...phaseWarnings[p.name]].join(', ')}</span>
                            <span>. The Run page will block any unsafe rerun until conflicting old outputs are deleted.</span>
                          </div>
                          <button className="flex-shrink-0 text-orange-500 hover:text-orange-700 font-bold leading-none"
                            onClick={()=>setPhaseWarnings(w=>{const nw={...w};delete nw[p.name];return nw;})}>✕</button>
                        </div>
                      )}
                      {/* Per-patient flag panel */}
                      <PatientFlagPanel flags={pFlags} isFirst={isFirst}
                        onFlagChange={(key,checked)=>handlePatientFlagChange(p.name,key,checked)}
                        mode={mode} setMode={setMode}
                        profileIntervalS={profileIntervalS} setProfileIntervalS={setProfileIntervalS}/>
                      {['phase_1','phase_2','phase_3'].map(pk=>cfg[pk]?(
                        <PhaseSection key={pk} phaseKey={pk} phaseData={cfg[pk]}
                          patientName={p.name} onChange={handleConfigChange}
                          descriptions={configMeta.field_descriptions||{}}
                          pipelineOptions={configMeta.pipeline_options||{}}
                          roiChoices={roiChoices} roiTaskGroups={roiTaskGroups}
                          pbpkCompatibleRois={pbpkCompatibleRois} roiOverlaps={roiOverlaps}
                          phase1RoiSubset={p1RoiSubset} patientShape={shape}
                          nativeSpacing={nativeSpacing} flags={pFlags}
                          systemCpuCount={systemCpuCount}
                          lesionSpecs={cfg?.phase_1?.synthetic_lesions_stage?.specs||null}
                          isFirst={isFirst} syncedStages={pSynced}
                          p1StageValid={p1StageValid}
                          onSyncToggle={(phaseKey,stageKey,v)=>handleSyncToggle(p.name,phaseKey,stageKey,v)}/>
                      ):null)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {page3Issues.length>0&&(
        <div className="mt-6 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
          <p className="font-semibold mb-1">Fix these config issues before continuing</p>
          <ul className="space-y-0.5">{page3Issues.map((issue,i)=><li key={i}>- {issue}</li>)}</ul>
        </div>
      )}
      <div className="mt-6 flex justify-end">
        <button onClick={onNext} disabled={!canContinue}
          className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold text-base transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-sm">
          Continue to Run →
        </button>
      </div>
    </div>
  );
}

// ─── Config Summary Card (per patient) ───────────────────────────────────────
function ConfigSummaryCard({patient,cfg,flags,projectDir,mode,profileIntervalS,isFirst,syncedCount,skipped,onToggleSkip}){
  const ph1=cfg?.phase_1;const ph2=cfg?.phase_2;const ph3=cfg?.phase_3;
  const seg=ph1?.segmentation_stage;
  const synth=ph1?.synthetic_lesions_stage;
  const tac=ph1?.pbpk_tac_stage;
  const simind=ph2?.simind_stage;
  const og=ph2?.opengate_stage;
  const pp=ph3?.spect_postprocess_stage;
  const dp=ph3?.dosemap_postprocess_stage;

  const kv=(label,val,fmt)=>{
    if(val===undefined||val===null) return null;
    let display;
    if(fmt) display=fmt(val);
    else if(Array.isArray(val)) display=val.length?val.join(', '):'—';
    else if(typeof val==='boolean') display=val?'Yes':'No';
    else display=String(val);
    return(
      <div className="flex gap-2 text-xs py-0.5">
        <span className="text-slate-400 w-44 shrink-0">{label}</span>
        <span className="text-slate-700 font-medium break-all">{display}</span>
      </div>
    );
  };

  const Section=({title,colorClass,children})=>(
    <div className="mb-3">
      <p className={`text-[10px] uppercase tracking-widest font-semibold mb-1.5 ${colorClass||'text-slate-400'}`}>{title}</p>
      <div className="bg-slate-50 rounded-xl px-3 py-2 space-y-0.5">{children}</div>
    </div>
  );

  const Badge=({label,color})=>{
    const c={
      blue:'bg-blue-100 text-blue-700',teal:'bg-teal-100 text-teal-700',
      purple:'bg-purple-100 text-purple-700',orange:'bg-orange-100 text-orange-700',
      emerald:'bg-emerald-100 text-emerald-700',amber:'bg-amber-100 text-amber-700',
      slate:'bg-slate-100 text-slate-600',
    }[color]||'bg-slate-100 text-slate-600';
    return <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${c}`}>{label}</span>;
  };

  const synthSpecs=synth?.specs&&typeof synth.specs==='object'?Object.entries(synth.specs):[];

  return(
    <div className={`bg-white border rounded-2xl p-5 shadow-sm ${skipped?'opacity-50 border-slate-200':'border-slate-200'}`}>
      {/* Header */}
      <div className="flex items-start justify-between gap-3 mb-3">
        <div className="flex items-center gap-2 flex-wrap">
          <span className={`font-semibold text-base ${skipped?'line-through text-slate-400':'text-slate-800'}`}>{patient.name}</span>
          {isFirst&&<span className="text-[9px] font-semibold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">Reference (Patient 1)</span>}
          {!isFirst&&syncedCount>0&&<span className="text-[9px] font-semibold bg-teal-100 text-teal-700 px-2 py-0.5 rounded-full">{syncedCount} stage{syncedCount!==1?'s':''} matched PT-1</span>}
          {skipped&&<span className="text-[9px] font-semibold bg-slate-200 text-slate-500 px-2 py-0.5 rounded-full">Skipped</span>}
        </div>
        <div className="flex items-center gap-3 shrink-0">
          {projectDir&&<span className="text-[10px] terminal-font text-slate-400 truncate max-w-xs">{projectDir}</span>}
          <button onClick={onToggleSkip} className={`text-[10px] font-semibold px-2.5 py-1 rounded-lg border transition-colors ${skipped?'bg-slate-100 text-slate-600 border-slate-300 hover:bg-slate-200':'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'}`}>
            {skipped?'Include':'Skip'}
          </button>
        </div>
      </div>
      {/* Active stage badges + run mode */}
      <div className="flex flex-wrap gap-1.5 mb-4">
        {flags.segmentation&&<Badge label="Segmentation" color="teal"/>}
        {flags.pbpk&&<Badge label="PBPK" color="teal"/>}
        {flags.synthetic_lesions&&<Badge label="Synthetic Lesions" color="orange"/>}
        {flags.spect&&<Badge label="SPECT Simulation" color="blue"/>}
        {flags.dosimetry&&<Badge label="Dosimetry" color="purple"/>}
        {flags.postprocess&&<Badge label="Post-Processing" color="teal"/>}
        <Badge label={mode||'PRODUCTION'} color={mode==='DEBUG'?'amber':'emerald'}/>
        {flags.profile&&<Badge label={`Profiling ${profileIntervalS}s`} color="slate"/>}
        {flags.logging_on&&<Badge label="Logging" color="slate"/>}
      </div>

      {/* ── Phase 1 ─────────────────────────────────────────────────────────── */}
      {seg&&(
        <Section title="Phase 1 — Segmentation" colorClass="text-teal-700">
          {kv('ROI subset', seg.roi_subset)}
        </Section>
      )}
      {synth&&flags.synthetic_lesions&&(
        <Section title="Phase 1 — Synthetic Lesions" colorClass="text-orange-600">
          {kv('Seed', synth.default_seed, v=>v===0?'Non-reproducible (0)':String(v))}
          {kv('Shrink factor', synth.auto_shrink_factor)}
          {kv('Start radius fraction', synth.auto_start_frac)}
          {kv('Max shrink iterations', synth.auto_max_shrink_iters)}
          {kv('Max placement attempts', synth.max_lesion_placement_attempts)}
          {synthSpecs.length>0&&(
            <div className="mt-1 space-y-1">
              {synthSpecs.map(([roi,spec])=>(
                <div key={roi} className="text-[10px] bg-white rounded-lg px-2 py-1 border border-slate-200">
                  <span className="font-semibold text-slate-600">{roi}:</span>{' '}
                  {spec.n_lesions} lesion{spec.n_lesions!==1?'s':''},{' '}
                  mode={spec.prob}{spec.prob==='gaussian'&&spec.sigma_mm?` σ=${spec.sigma_mm}mm`:''},{' '}
                  margin={spec.margin_mm}mm
                  {spec.radii_mm?`, radii=[${spec.radii_mm.join(',')}]mm`:''}
                </div>
              ))}
            </div>
          )}
        </Section>
      )}
      {tac&&(
        <Section title="Phase 1 — PBPK Pharmacokinetics" colorClass="text-teal-700">
          {kv('Model type', tac.model_type||tac.ModelType)}
          {kv('Isotope', tac.isotope||tac.Isotope)}
          {kv('Randomize kidney / SG', tac.Randomization_Kidney_SG_Para)}
          {kv('Height', tac.height_m, v=>(v&&Number(v)>0)?`${v} m`:'From DICOM / model default')}
          {kv('Weight', tac.weight_kg, v=>(v&&Number(v)>0)?`${v} kg`:'From DICOM / model default')}
        </Section>
      )}

      {/* ── Phase 2 ─────────────────────────────────────────────────────────── */}
      {flags.spect&&simind&&(
        <Section title="Phase 2 — SIMIND Simulation" colorClass="text-blue-700">
          {kv('ROI subset', simind.roi_subset)}
          {kv('Collimator', simind.Collimator||simind.collimator)}
          {kv('Isotope', simind.isotope||simind.Isotope)}
          {kv('Projections', simind.NumProjections||simind.num_projections)}
          {kv('Photon histories', simind.NumPhotons||simind.num_photons)}
          {kv('Energy window', simind.EnergyWindowWidth||simind.energy_window_width, v=>`${v}%`)}
          {kv('Detector distance', simind.DetectorDistance??simind.detector_distance, v=>v<0?'Auto-contour to patient':`${v} cm`)}
          {kv('Voxel spacing', simind.xyz_spacing_mm, v=>v===null?'Native CT resolution':`${v.join(' × ')} mm`)}
          {kv('CPU cores', simind.num_cpu, v=>v===0?'All available':String(v))}
        </Section>
      )}
      {flags.dosimetry&&og&&(
        <Section title="Phase 2 — OpenGATE Dosimetry" colorClass="text-purple-700">
          {kv('ROI subset', og.roi_subset)}
          {kv('Isotope', og.source?.isotope)}
          {kv('Histories / batch', og.gate?.total_histories_per_batch)}
          {kv('Threads', og.gate?.num_threads, v=>v===0?'All available':String(v))}
          {kv('Target uncertainty', og.gate?.target_uncertainty_percent!=null?`${og.gate.target_uncertainty_percent}%`:null)}
          {kv('Variance reduction', og.variance_reduction)}
          {kv('Voxel spacing', og.xyz_spacing_mm, v=>v===null?'Native CT resolution':`${v.join(' × ')} mm`)}
          {kv('Save per-ROI dose maps', og.save_per_roi_dose_maps)}
          {kv('Save summed dose map', og.save_summed_dose_map)}
          {kv('Density tolerance', og.physics?.density_tolerance_gcm3, v=>`${v} g/cm³`)}
        </Section>
      )}

      {/* ── Phase 3 ─────────────────────────────────────────────────────────── */}
      {flags.postprocess&&flags.spect&&pp&&(
        <Section title="Phase 3 — SPECT Post-Processing" colorClass="text-teal-700">
          {kv('Algorithm', pp.ReconstructionAlgorithm||pp.reconstruction_algorithm)}
          {kv('Subsets', pp.Subsets||pp.num_subsets)}
          {kv('Iterations', pp.Iterations||pp.num_iterations)}
          {kv('Apply TAC', pp.apply_tac)}
          {kv('Apply Poisson noise', pp.apply_poisson_noise)}
          {kv('Apply reconstruction', pp.apply_reconstruction)}
          {Array.isArray(pp.FrameStartTimes)&&kv('Frame start times', pp.FrameStartTimes, v=>`[${v.join(', ')}] min p.i.`)}
          {Array.isArray(pp.FrameDurations)&&kv('Frame durations', pp.FrameDurations, v=>`[${v.join(', ')}] s`)}
        </Section>
      )}
      {flags.postprocess&&flags.dosimetry&&dp&&(
        <Section title="Phase 3 — Dosimetry Post-Processing" colorClass="text-purple-700">
          {kv('Apply TAC scaling', dp.apply_tac)}
        </Section>
      )}
    </div>
  );
}

// ─── Page 4 ───────────────────────────────────────────────────────────────────
function Page4Run({patients,projectName,projectDirs,patientFlags,mode,patientConfigs,patientSpacings,profileIntervalS,onBack}){
  const [status,setStatus]=useState('idle'); // idle | starting | launched | error
  const [errorMsg,setErrorMsg]=useState('');
  const [validation,setValidation]=useState(null);
  const [rerunValidation,setRerunValidation]=useState({checking:true,ok:true,conflictsByPatient:{}});
  const [skippedPatients,setSkippedPatients]=useState(new Set());
  const toggleSkip=useCallback(name=>setSkippedPatients(prev=>{const next=new Set(prev);next.has(name)?next.delete(name):next.add(name);return next;}),[]);
  const activePatients=useMemo(()=>patients.filter(p=>!skippedPatients.has(p.name)),[patients,skippedPatients]);

  // Pre-run validation — per-patient flags
  useEffect(()=>{
    const issues=[];
    if(!projectName.trim()) issues.push('Project name is empty');
    if(!activePatients.length) issues.push('All patients are skipped — include at least one');
    activePatients.forEach(p=>{
      const flags=patientFlags?.[p.name]||DEFAULT_FLAGS;
      if(!projectDirs[p.name]) issues.push(`Missing output directory for "${p.name}"`);
      if(flags.profile&&!validateProfileInterval(profileIntervalS))
        issues.push(`[${p.name}] Profiler sampling interval must be between 0.1 s and 3.0 s`);
      const cfg=patientConfigs?.[p.name];
      const nativeSpacing=patientSpacings?.[p.name]||null;
      if(!cfg) return;
      const fst=cfg?.phase_3?.spect_postprocess_stage?.FrameStartTimes;
      const fd =cfg?.phase_3?.spect_postprocess_stage?.FrameDurations;
      if(Array.isArray(fst)&&Array.isArray(fd)){
        if(fst.length!==fd.length) issues.push(`[${p.name}] FrameStartTimes (${fst.length}) ≠ FrameDurations (${fd.length})`);
        fst.forEach((v,i)=>{if(typeof v!=='number'||isNaN(v)) issues.push(`[${p.name}] FrameStartTimes[${i}] must be a number`);});
        fd.forEach((v,i)=>{ if(typeof v!=='number'||isNaN(v)) issues.push(`[${p.name}] FrameDurations[${i}] must be a number`);});
      }
      const p1Rois=cfg?.phase_1?.segmentation_stage?.roi_subset;
      const p1Set=new Set(Array.isArray(p1Rois)?p1Rois:[]);
      const checkSimulationSubset=(roi,stageName)=>{
        if(!Array.isArray(roi)) return;
        const reserved=roi.filter(r=>RESERVED_ROIS.has(r));
        if(reserved.length)
          issues.push(`[${p.name}] ${stageName} contains internal ROI(s): ${reserved.join(', ')}. The pipeline adds internal sources automatically.`);
        if(flags.segmentation){
          const missingP1=roi.filter(r=>!p1Set.has(r)&&!RESERVED_ROIS.has(r));
          if(missingP1.length)
            issues.push(`[${p.name}] ${stageName} ROI(s) not selected in Phase 1: ${missingP1.join(', ')}`);
        }
      };
      if(flags.spect){
        const roi=cfg?.phase_2?.simind_stage?.roi_subset;
        if(!Array.isArray(roi)||roi.length===0)
          issues.push(`[${p.name}] SPECT is ON but no ROIs are selected in the SIMIND stage`);
        else checkSimulationSubset(roi,'SIMIND');
        validateXyzSpacingRule(cfg?.phase_2?.simind_stage?.xyz_spacing_mm,nativeSpacing)
          .forEach(msg=>issues.push(`[${p.name}] SIMIND xyz_spacing_mm ${msg}`));
      }
      if(flags.postprocess&&flags.spect){
        const pp=cfg?.phase_3?.spect_postprocess_stage;
        if(pp&&!pp.apply_tac&&!pp.apply_poisson_noise&&!pp.apply_reconstruction)
          issues.push(`[${p.name}] Post-Processing + SPECT: enable at least one of Apply TAC, Apply Noise, or Apply Reconstruction`);
      }
      if(flags.dosimetry){
        const roi=cfg?.phase_2?.opengate_stage?.roi_subset;
        const gate=cfg?.phase_2?.opengate_stage?.gate||{};
        if('total_histories' in gate)
          issues.push(`[${p.name}] OpenGATE total_histories was replaced by total_histories_per_batch`);
        if('num_cpu' in gate)
          issues.push(`[${p.name}] OpenGATE num_cpu was replaced by num_threads`);
        if('random_seed' in gate)
          issues.push(`[${p.name}] OpenGATE random_seed is no longer user-configurable`);
        if(!Array.isArray(roi)||roi.length===0)
          issues.push(`[${p.name}] Dosimetry is ON but no ROIs are selected in the OpenGATE stage`);
        else checkSimulationSubset(roi,'OpenGATE');
        validateXyzSpacingRule(cfg?.phase_2?.opengate_stage?.xyz_spacing_mm,nativeSpacing)
          .forEach(msg=>issues.push(`[${p.name}] OpenGATE xyz_spacing_mm ${msg}`));
        if(!Number.isInteger(Number(gate.num_threads))||Number(gate.num_threads)<0)
          issues.push(`[${p.name}] OpenGATE num_threads must be a whole number >= 0`);
        if(!Number.isInteger(Number(gate.total_histories_per_batch))||Number(gate.total_histories_per_batch)<=0)
          issues.push(`[${p.name}] OpenGATE total_histories_per_batch must be a positive whole number`);
        if(isNaN(Number(gate.target_uncertainty_percent))||Number(gate.target_uncertainty_percent)<0||Number(gate.target_uncertainty_percent)>100)
          issues.push(`[${p.name}] OpenGATE target_uncertainty_percent must be between 0 and 100`);
      }
    });
    setValidation({ok:!issues.length,issues});
  },[patientConfigs,patientFlags,activePatients,patientSpacings,profileIntervalS,projectName,projectDirs]);

  useEffect(()=>{
    let cancelled=false;
    const readyForCheck=activePatients.length>0&&activePatients.every(p=>projectDirs[p.name]);
    if(!readyForCheck){
      setRerunValidation({checking:false,ok:true,conflictsByPatient:{}});
      return;
    }
    setRerunValidation(prev=>({...prev,checking:true}));
    apiFetch('/api/validate-rerun',{
      method:'POST',
      body:JSON.stringify({patients:activePatients,project_dirs:projectDirs,patient_flags:patientFlags,patient_configs:patientConfigs}),
    })
      .then(async res=>{
        if(!res.ok){
          const err=await res.json().catch(()=>({detail:'Rerun validation failed'}));
          throw new Error(err.detail||'Rerun validation failed');
        }
        return res.json();
      })
      .then(data=>{
        if(cancelled) return;
        setRerunValidation({
          checking:false,
          ok:!!data.ok,
          conflictsByPatient:data.conflicts_by_patient||{},
        });
      })
      .catch(err=>{
        if(cancelled) return;
        setRerunValidation({
          checking:false,
          ok:false,
          conflictsByPatient:{_global:[{stage:'setup',message:err.message}]},
        });
      });
    return()=>{cancelled=true;};
  },[activePatients,projectDirs,patientFlags,patientConfigs]);

  const startRun=async()=>{
    setStatus('starting');setErrorMsg('');
    try{
      const res=await apiFetch('/api/run',{method:'POST',body:JSON.stringify({project_name:projectName,patients:activePatients,project_dirs:projectDirs,patient_flags:patientFlags,patient_configs:patientConfigs,mode,profile_interval_s:profileIntervalS})});
      if(!res.ok){const err=await res.json();setErrorMsg(err.detail||'Unknown server error');setStatus('error');return;}
      setStatus('launched');
    }catch(e){setErrorMsg(e.message);setStatus('error');}
  };

  const rerunIssues=Object.entries(rerunValidation.conflictsByPatient||{}).flatMap(([patientName,conflicts])=>
    (conflicts||[]).map(conflict=>`[${patientName}] ${conflict.message}`)
  );
  const combinedIssues=[...(validation?.issues||[]),...rerunIssues];
  const allChecksPassed=(validation?.ok??false)&&!rerunValidation.checking&&rerunValidation.ok&&combinedIssues.length===0&&activePatients.length>0;
  const canRun=allChecksPassed&&status==='idle';

  // ── Launched screen ────────────────────────────────────────────────────────
  if(status==='launched'){
    return(
      <div className="max-w-lg mx-auto px-6 py-16 text-center">
        <div className="bg-white/95 border border-slate-200 rounded-2xl shadow-sm px-8 py-10">
          <h2 className="text-2xl font-bold text-slate-900 mb-3">Pipeline Started</h2>
          <p className="text-slate-500 mb-8 leading-relaxed">
            The pipeline is now running in the terminal where you launched{' '}
            <code className="bg-slate-100 px-1.5 py-0.5 rounded text-sm font-mono">python run_server.py</code>.
            Monitor progress there.
          </p>
          <div className="bg-slate-100 border border-slate-200 rounded-2xl px-6 py-5 mb-8 text-left">
            <p className="text-slate-700 font-semibold mb-2 text-sm">Output directories</p>
            {patients.map(p=>(
              <div key={p.name} className="text-xs terminal-font text-slate-500 break-all mb-1">
                <span className="font-semibold text-slate-600">{p.name}:</span> {projectDirs[p.name]||'—'}
              </div>
            ))}
          </div>
          <p className="text-slate-500 text-sm">You can close this tab — the pipeline will continue running.</p>
        </div>
      </div>
    );
  }

  // ── Main review + run screen ───────────────────────────────────────────────
  return(
    <div className="max-w-4xl mx-auto px-6 py-8">
      <div className="flex items-center gap-3 mb-6 bg-white/90 rounded-xl px-4 py-3 shadow-sm">
        <button onClick={onBack}
          className="text-slate-400 hover:text-slate-600 text-sm flex items-center gap-1">
          ← Back
        </button>
        <h2 className="text-2xl font-bold text-slate-900">Review & Run</h2>
      </div>

      {/* Validation panel */}
      {validation&&(
        <div className={`rounded-2xl p-4 mb-6 border ${
          rerunValidation.checking?'bg-slate-50 border-slate-200':
          allChecksPassed?'bg-emerald-50 border-emerald-200':'bg-red-50 border-red-200'
        }`}>
          <p className={`font-semibold mb-2 ${
            rerunValidation.checking?'text-slate-700':
            allChecksPassed?'text-emerald-800':'text-red-700'
          }`}>
            {rerunValidation.checking
              ?'Checking rerun compatibility…'
              :allChecksPassed
                ?'✓ All checks passed — ready to run'
                :'✗ Fix these issues before running'}
          </p>
          {rerunValidation.checking?(
            <div className="text-sm text-slate-600 space-y-0.5">
              <p>· Comparing the selected CT and current config against any existing stage metadata</p>
            </div>
          ):allChecksPassed?(
            <div className="text-sm text-emerald-700 space-y-0.5">
              <p>· {activePatients.length} patient{activePatients.length!==1?'s':''} queued{skippedPatients.size>0?` (${skippedPatients.size} skipped)`:''}</p>
              <p>· Mode: <span className="font-semibold">{mode}</span></p>
            </div>
          ):(
            <ul className="space-y-1">{combinedIssues.map((iss,i)=><li key={i} className="text-sm text-red-700 whitespace-pre-line">· {iss}</li>)}</ul>
          )}
        </div>
      )}

      {/* Per-patient config summary */}
      <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-3 bg-white/90 rounded-xl px-4 py-2 inline-block shadow-sm">Configuration Summary</h3>
      <div className="space-y-4 mb-8">
        {patients.map((p,i)=>(
          <ConfigSummaryCard key={p.name} patient={p} cfg={patientConfigs?.[p.name]}
            flags={patientFlags?.[p.name]||DEFAULT_FLAGS}
            projectDir={projectDirs[p.name]} mode={mode} profileIntervalS={profileIntervalS}
            isFirst={i===0}
            syncedCount={0}
            skipped={skippedPatients.has(p.name)}
            onToggleSkip={()=>toggleSkip(p.name)}/>
        ))}
      </div>

      {/* Error from API */}
      {status==='error'&&errorMsg&&(
        <div className="mb-4 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700">
          <span className="font-semibold">Server error: </span>{errorMsg}
        </div>
      )}

      {/* Run button */}
      <button onClick={startRun} disabled={!canRun||status==='starting'}
        className="bg-emerald-600 hover:bg-emerald-700 text-white px-10 py-3.5 rounded-xl font-semibold text-base transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        {status==='starting'?<><span className="spin">⟳</span>&nbsp;Starting…</>:'▶  Run Pipeline'}
      </button>
      <p className="text-xs text-slate-500 mt-2 bg-white/90 rounded-lg px-3 py-1.5 inline-block shadow-sm">
        The pipeline will run in your terminal. You can close this tab once started.
      </p>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App(){
  const [step,setStep]=useState(1);
  const [patients,setPatients]=useState([]);
  const [patientShapes,setPatientShapes]=useState({});
  const [patientSpacings,setPatientSpacings]=useState({});
  const [projectName,setProjectName]=useState('');
  const [projectDirs,setProjectDirs]=useState({});
  const [patientConfigs,setPatientConfigs]=useState({});
  const [patientFlags,setPatientFlags]=useState({});   // {patientName: {segmentation,...}}
  const [syncedStages,setSyncedStages]=useState({});   // {patientName: Set<stageKey>}
  const [mode,setMode]=useState('PRODUCTION');
  const [profileIntervalS,setProfileIntervalS]=useState(2.0);
  const [systemCpuCount,setSystemCpuCount]=useState(null);

  useEffect(()=>{
    apiFetch('/api/system-info').then(r=>r.json()).then(d=>setSystemCpuCount(d.cpu_count||null)).catch(()=>{});
  },[]);

  return(
    <div className="min-h-screen">
      <StepBar step={step}/>
      <div className="pb-16">
        {step===1&&<Page1Welcome onNext={()=>setStep(2)}/>}
        {step===2&&<Page2CTInput patients={patients} setPatients={setPatients}
          patientShapes={patientShapes} setPatientShapes={setPatientShapes}
          patientSpacings={patientSpacings} setPatientSpacings={setPatientSpacings}
          onNext={()=>setStep(3)} onBack={()=>setStep(1)}/>}
        {step===3&&<Page3Configure patients={patients}
          projectName={projectName} setProjectName={setProjectName}
          projectDirs={projectDirs} setProjectDirs={setProjectDirs}
          patientConfigs={patientConfigs} setPatientConfigs={setPatientConfigs}
          patientFlags={patientFlags} setPatientFlags={setPatientFlags}
          syncedStages={syncedStages} setSyncedStages={setSyncedStages}
          mode={mode} setMode={setMode}
          profileIntervalS={profileIntervalS} setProfileIntervalS={setProfileIntervalS}
          patientShapes={patientShapes} patientSpacings={patientSpacings} systemCpuCount={systemCpuCount}
          onNext={()=>setStep(4)} onBack={()=>setStep(2)}/>}
        {step===4&&<Page4Run patients={patients} projectName={projectName}
          projectDirs={projectDirs} patientFlags={patientFlags} mode={mode}
          patientConfigs={patientConfigs} patientSpacings={patientSpacings} profileIntervalS={profileIntervalS}
          onBack={()=>setStep(3)}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
